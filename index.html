-fifths of Congress reserved southern, from the Compromise", "Each free person counting three-fifths to shrink large states", "Three-fifths of the trade banned at once, from northern laws", "Virginia gaining three senators per five, from New Jersey's plan", "The enslaved freed in three-fifths of states, from the Ordinance"], "example": "The 3/5 rule balanced north and south: extra southern seats, but fewer than full counting would give.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-16", "week": "t2l2", "word": "Why did many northern states object to counting enslaved people in population counts?", "definition": "The enslaved couldn't vote, so counting gifted seats south", "wrong": ["Counting them would force immediate emancipation in every single state, freeing them all", "They should count fully so the north itself would gain more seats", "Only property-owning white men should ever enter population counts", "Congress rather than the individual states should conduct the count", "Counting them excused Britain keeping its forts", "They should count for taxes, funds sent to France", "The census violated domestic tranquillity", "Rhode Island's absence should shrink southern totals", "Counting them demanded two-thirds votes per bill"], "example": "No vote, no count: the north saw slave-counting as inflated southern power in the House.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-17", "week": "t2l2", "word": "How did the Three-Fifths Compromise change Virginia's representation, estimated for 1790?", "definition": "Virginia counted 617,753 for twenty seats, not fifteen", "wrong": ["Virginia's 442,177 free residents alone granting 25 seats, cut down to 15 in the 1790 count", "Virginia counting 292,627 enslaved fully and leaping to 31 seats", "Virginia losing the count entirely, falling 43 seats to 31", "Virginia's mixed 617,753 count electing 25 senators", "The compromise granting Virginia 36 sections of land", "Virginia gaining 60,000 settlers, seeking statehood", "Virginia frozen at 15 as slave counting was banned", "The national capital moved, costing Virginia 12 seats", "Virginia keeping one Articles vote, 31 votes in total"], "example": "The worked example shows the bargain's price: Virginia +5 seats over free-only, −5 under full counting.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-18", "week": "t2l2", "word": "What further slavery compromises did northern and southern states reach over the slave trade and fugitives?", "definition": "No slave-trade ban for twenty years, plus a fugitive clause", "wrong": ["The slave trade banned at once in 1787 with full freedom granted in a year", "The south ending slavery in twenty years in exchange for payment", "Congress barred forever; fugitives freed in the north", "The north returning slave taxes; the south keeping trade", "The trade capped at three-fifths of ships; fugitives free", "The south banning the trade itself amid protests", "Britain deciding the trade after war debts were paid", "Fugitives granted jury trials; the trade moving west", "The trade taxed $640 per head with school sections"], "example": "Economy trumped ideals again: 20 protected years for the trade plus forced return — raising the ethical question of freedom beside slavery.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-19", "week": "t2l2", "word": "After signing, how would the Constitution take effect?", "definition": "Each state voted in convention; nine endorsements made law", "wrong": ["Congress approving by nine votes and enforcing the plan on all thirteen", "Washington signing alone with effect everywhere the very same day", "Parliament in London ratifying first before state conventions met", "All thirteen approved unanimously, as in the Articles", "Rhode Island alone decided, having skipped the Convention", "The Supreme Court reviewed it first, ordering compliance", "Three-fifths of voters petitioned in each state in time", "The French king countersigned before nine states voted", "Legislatures barred; only Congress could ratify"], "example": "Nine-state trigger via state conventions — creation began the ratification struggle of Lesson 4.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-20", "week": "t2l2", "word": "What do the Preamble's opening words 'We the People of the United States, in order to form a more perfect union...' signify?", "definition": "'We the People' vests power in the people, seeking union", "wrong": ["Listing the three branches and assigning them powers over the states", "Counting three-fifths of the people for the very first census", "Demanding nine states approve each and every amendment", "Stripping Congress of every power over slave imports for twenty full years to protect the trade", "Banning the slave trade for twenty years across the nation", "Letting Congress tax without consulting any council", "Fixing Rhode Island as the permanent national capital", "Barring state ratifying conventions forevermore", "Splitting large-state and small-state peoples"], "example": "'We the People' announces popular authority and union as the Constitution's first purpose.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L3-01", "week": "t2l3", "word": "What is a republic, the kind of government the delegates wanted to create?", "definition": "Citizens ruling together through elected representatives", "wrong": ["One person holding complete authority by claimed divine right of kings", "A king forced to obey Parliament and the courts under law", "States each keeping one vote whatever their size or people", "Citizens voting directly on every law at town meeting", "Three-fifths of the people electing a monarch for life", "The military placed permanently above civilian authority", "Judges depending entirely on the president's will", "Nine states approving every single decision unanimously", "The church establishing one official religion for all"], "example": "Few republics in history lasted long — so the Framers studied Greece and Rome to build one that would.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-02", "week": "t2l3", "word": "What is civic republicanism, the tradition the founders admired in the Roman Republic?", "definition": "Citizen participation promoting the community's well-being", "wrong": ["One ruler holding complete authority over the entire republic", "Only nobles allowed to serve in public office or own property", "Counting three-fifths of the people for representation", "Nine states required to approve taxes unanimously", "Citizens obeying laws but never helping make them", "The army choosing civilian leaders in wartime", "Ignorance and freedom naturally going together", "Republics falling only when invaded from outside", "One official church established for the nation"], "example": "Roman independence and public service — citizens serving from devotion, not personal gain — became the founders' ideal.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-03", "week": "t2l3", "word": "What warning did the founders take from the collapse of Rome's republic?", "definition": "Without devoted citizens, republics corrupt and decay from within", "wrong": ["Republics falling only to outside invasion, so build ever bigger armies", "Rome falling to slave-counting, so the founders banned all counting", "Rome falling to too much schooling, so Jefferson opposed public schools", "Rome fell through town meetings, so forbid self-rule", "Rome fell to a law-bound king, so free the President", "Rome fell to written laws, so keep frames unwritten", "Rome fell by women's property, so strip married rights", "Rome fell to trade laws, so ban Congress from commerce", "Rome fell to three branches, so merge all powers"], "example": "Historians say the founders exaggerated Rome's virtues, but the warning stands: decay from  in the Magna Carta, signed by King John of England in 1215, helped shape American government?", "definition": "Monarchs obey; noble jury and property rights spread", "wrong": ["Kings blithely taxing whatever they wished while nobles held no rights at all", "Elections banned outright and jury trial denied to everyone", "Kings owning all property; habeas corpus abolished", "Citizens bearing arms for the king; church running courts", "Three branches created at once with executive judges", "Three-fifths counted for taxes; trade banned for years", "Kings answering to no council; towns barred from meeting", "All power to Parliament; monarchy abolished in 1215", "Property outlawed; only kings claiming juries"], "example": "Law-above-king plus protected rights seeded both limited government and free enterprise in America.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-07", "week": "t2l3", "word": "How did the Magna Carta's tax clause point toward Parliament?", "definition": "John barred taxes without his Great Council", "wrong": ["Parliament gaining the power to tax America without its consent", "Every tax abolished forever and the Great Council disbanded", "Nine American states approving each tax before it took effect", "Three-fifths of property taxed for Crusades", "The Council electing a new king every two years", "The Council quartering troops in every home", "The Council barred from meeting after 1215", "Council seats sold off for 640 acres each", "The Council vetoing church appointments"], "example": "No taxes without consultation: the ancestor of 'no taxation without representation' and of legislatures checking rulers.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-08", "week": "t2l3", "word": "What did the English Bill of Rights of 1689 add beyond the Magna Carta?", "definition": "Elections, juries, some arms, habeas corpus — beyond 1215", "wrong": ["Parliament abolished and the king's unlimited taxing power fully restored", "Jury trials ended and jailing without any charge allowed", "Arms banned for everyone and every court in England closed", "Three-fifths of all prisoners counted for seats in Parliament", "Kings vetoing Congress and colonial assemblies", "Thirteen-state unanimity for every law passed", "Slavery founded; the trade banned in colonies", "Elections banned; judges serving the king", "Townships taxed $640 per section for the Crown"], "example": "1689 went further than 1215 in protecting citizens — the document William and Mary received in the engraving.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-09", "week": "t2l3", "word": "What is habeas corpus, affirmed in the English Bill of Rights?", "definition": "No jailing anyone without a criminal charge", "wrong": ["Kings raising whatever taxes they fancied without consulting any council", "Parliament vetoing the laws passed by the colonies", "Three-fifths of prisoners counted for taxes", "Judges serving at the president's pleasure", "Soldiers housed in private homes without consent", "The church establishing an official religion", "Nine states approving every criminal trial", "Nobles inheriting their legislature seats", "Elections suspended for the whole wartime"], "example": "Charge-or-release: a core liberty the Framers carried from English tradition into American law.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-10", "week": "t2l3", "word": "What were John Locke's two great ideas in Two Treatises of Government (1690)?", "definition": "Life, liberty, property; ruler-ruled pact allows revolt", "wrong": ["All earthly power flowing divinely to kings, the people never questioning it", "Three branches needed, with every tax passing unanimously", "People owning nothing; rulers jailing at will", "Liberty as obeying Parliament; nobles owning all", "Rulers chosen by lot; rebellion always forbidden", "Rights for church members only; kings divinely wise", "Life granted by Congress; property three-fifths held", "Monarchy forever; the contract never broken", "Rights from the Bill alone; rebellion over with Rome"], "example": "Locke's natural rights and ruler-ruled agreement made revolution justifiable — and made the Constitution a contract.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-11", "week": "t2l3", "word": "How did Locke's ideas shape the Constitution's protection of property and business?", "definition": "Property and enterprise shielded, plus commerce power", "wrong": ["All private property banned outright and handed over to Congress by the Convention", "Congress forbidden to regulate any trade whatsoever", "All property split in 36 sections to be sold to government", "Business capped at three-fifths of approved merchants", "Contracts taxed $640; interstate shipping banned", "Only kings owning land or enforcing deals", "Commerce to militias; Congress printing worthless dollars", "Property reserved for nobles, as back in 1215", "Locke rejected; Britain regulating all trade"], "example": "Locke-to-commerce: property and contract guarantees plus the commerce power built thriving free enterprise.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-12", "week": "t2l3", "word": "What did Charles-Louis Montesquieu argue in The Spirit of the Laws (1748)?", "definition": "Powers divided: lawmakers pass, executives execute", "wrong": ["One wise king holding every power undefined for the sake of speed, as in 1748", "Two houses sufficing, with both apportioned strictly by population", "The people voting on every law at their town meetings", "No courts needed, with legislatures judging themselves", "Three-fifths of power southern, the rest northern", "Executives passing laws; legislatures executing", "Powers kept secret from questioning citizens", "The church defining powers; priests judging all", "Nine states nce for funding the Revolution against Britain", "The coming Bill of Rights was made far too long to memorize", "Rhode Island gained veto power over all twelve other states", "Unanimous votes were demanded so the government froze solid", "State governments were banned and all moved to the capital", "The Supreme Court gained veto power over every state election", "Washington was crowned king for life with no election ever held"], "example": "Even expecting honorable Washington as first President, Antifederalists warned future Presidents might lack his honor and skill.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-04", "week": "t2l4", "word": "What were the Federalist Papers, and why do they still matter?", "definition": "Madison, Hamilton, and Jay: pen-name essays defending the plan, cited still", "wrong": ["Patrick Henry's fiery anti-ratification pamphlets, which are still read as Virginia law even today", "Fierce newspaper attacks on Washington's presidency, still quoted in every campaign season", "Madison's twelve proposed amendments, which are still pending today before the states", "Secret Convention journals published at once, still sealed away today in the archives", "British essays defending the king, still cited against America", "1776 collections of state bills of rights, still binding Congress", "Love letters between delegates, still displayed in Philadelphia", "The first federal tax codes, still collected the same way", "Military orders from Yorktown, still obeyed by the Guard"], "example": "Among the best discussions of American political theory — written to win ratification, lasting as judicial guidance.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-05", "week": "t2l4", "word": "Who was Alexander Hamilton, author of more than 50 of the 85 Federalist Papers?", "definition": "Nevis-born New Yorker, 50+ essays, Treasury chief, killed by Burr", "wrong": ["The Virginia planter who wrote the 1776 state bill of rights and fiercely opposed ratification ever since", "The soft-spoken Virginian who out-argued Henry's seven-hour speeches", "The Pennsylvanian who carried ratification days after Delaware voted", "The patriot who held Massachusetts out for a rights pledge", "The Frenchman of Brandywine who secured thousands of soldiers", "The Prussian who drilled Washington's troops to march", "The Chief Justice who founded review in Marbury", "The President impeached by the House but acquitted", "The governor who flipped Virginia to ratify in June"], "example": "Hamilton at 14 ran a St. Croix business managing older men — precocity that carried into treasury and tragedy.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-06", "week": "t2l4", "word": "What was the Antifederalists' chief objection to the Constitution?", "definition": "The plan listed no guaranteed protections of individual rights anywhere at all", "wrong": ["Three separate branches created instead of Congress ruling over everything itself", "One vote per state kept in place whatever each state's size or population might be", "Nine states were needed rather than all thirteen", "Three-fifths of the enslaved were counted in the census", "Congress was allowed to regulate trade between states", "Conventions were set up instead of legislatures voting", "New York City was named the nation's first capital", "The Vice President was set to preside over the Senate", "Presidents were allowed to pardon federal offenders"], "example": "No Declaration of Rights: the missing list dominated every state debate.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-07", "week": "t2l4", "word": "How did Federalists answer the demand for a bill of rights, and how did Antifederalists reply?", "definition": "All rights can't be listed; speech and religion must be spelled out", "wrong": const LETTERS = ["A", "B", "C", "D"];
const state = { queue: [], idx: 0, score: 0, streak: 0, best: 0, right: 0, wrong: 0, trapHits: 0, missed: [], loseStreak: 0, current: null, locked: false, filter: "all", count: "all", mode: "meaning" };

function $(id) { return document.getElementById(id); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* Build 4 options: the correct answer + 3 distractors sampled fresh
   from this question's own wrong list on every run. */
function buildOptions(entry, all) {
  const usedDefs = new Set([entry.definition]);
  const pool = shuffle((entry.wrong || []).filter(function (w) { return w && !usedDefs.has(w); }));
  const opts = [{ text: entry.definition, kind: "correct" }];
  for (let k = 0; k < 3 && pool.length; k++) {
    const t = pool.pop();
    opts.push({ text: t, kind: "wrong" });
    usedDefs.add(t);
  }
  return shuffle(opts);
}

function startGame(filter) {
  state.filter = (filter === undefined) ? state.filter : filter;
  const pool = state.filter === "all" ? WORDS.slice() : WORDS.filter(w => String(w.week) === String(state.filter));
  const n = state.count === "all" ? pool.length : Math.min(parseInt(state.count, 10) || pool.length, pool.length);
  state.queue = shuffle(pool.slice()).slice(0, n);
  state.idx = 0; state.score = 0; state.streak = 0;
  state.right = 0; state.wrong = 0; state.trapHits = 0; state.missed = []; state.loseStreak = 0;
  nextQuestion();
}

function nextQuestion() {
  state.locked = false;
  hideOverlay();
  if (state.idx >= state.queue.length) { endScreen(); return; }
  const entry = state.queue[state.idx];
  state.current = { entry: entry, options: buildOptions(entry, WORDS) };
  render();
}

function render() {
  const c = state.current, entry = c.entry;
  $("weekPill").textContent = entry.lesson || ("Lesson " + entry.week);
  $("typePill").textContent = "question";
  $("word").textContent = entry.word;
  $("prompt").textContent = "Choose the correct answer:";
  $("hint").textContent = "4 answers: the correct one plus 3 look-alikes drawn from similar events. Read carefully.";
  buddyMood();
  updateFury();
  runBlab();
  $("qnum").textContent = (state.idx + 1) + "/" + state.queue.length;
  $("score").textContent = state.score;
  $("streak").textContent = state.streak;
  $("bar").style.width = Math.round((state.idx / state.queue.length) * 100) + "%";
  const box = $("options");
  box.innerHTML = "";
  c.options.forEach(function (o, i) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.dataset.idx = i;
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + escapeHtml(o.text) + '</span>';
    b.addEventListener("click", function () { answer(i); });
    box.appendChild(b);
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

  if (!soundOn) return;

    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  } catch (e) { /* audio unavailable: stay silent */ }
}

  if (actx) { try { actx.close(); } catch (e) {} }

  buttons.forEach(function (b) { b.disabled = true; });
  c.options.forEach(function (o, k) {
    if (o.kind === "correct" && buttons[k]) buttons[k].classList.add("correct");
  });
  const hit = chosen && chosen.kind === "correct";
  if (hit) {
    state.score += 10 + Math.min(state.streak, 5);
    state.streak += 1;
    state.best = Math.max(state.best, state.streak);
    state.right += 1;
    const wasFurious = state.loseStreak >= 10;
    state.loseStreak = 0;
    if (buttons[i]) buttons[i].classList.add("correct");
    if (wasFurious) playRelief(); else playCorrect();
    showHappy(c, wasFurious);
  } else {
    state.wrong += 1;
    state.streak = 0;
    state.loseStreak += 1;
    state.missed.push(c.entry);
    if (buttons[i]) buttons[i].classList.add("picked-wrong");
    if (chosen && chosen.kind === "trap") state.trapHits += 1;
    if (state.loseStreak >= 10) playAngry(); else if (chosen && chosen.kind === "trap") playTrap(); else playWrong();

  $("streak").textContent = state.streak;

}

    s.className = conf ? "confetti" : "sparkle";
    if (conf) {
      s.style.left = (4 + Math.random() * 92) + "%";
      s.style.background = colors[k % colors.length];
      s.style.animationDelay = (Math.random() * 0.5) + "s";
    } else {
      s.textContent = "+";
      s.style.left = (8 + Math.random() * 84) + "%";
      s.style.top = (18 + Math.random() * 50) + "%";
      s.style.animationDelay = (Math.random() * 0.4) + "s";
    }
    panel.appendChild(s);
  }
}

function addTears(panel, enabled) {
  if (!enabled) return;
  for (let k = 0; k < 7; k++) {
    const t = document.createElement("span");
    t.className = "tear";
    t.style.left = (18 + k * 10) + "%";
    t.style.animationDelay = (k * 0.09) + "s";
    panel.appendChild(t);
  }
  for (let k = 0; k < 14; k++) {
    const r = document.createElement("span");
    r.className = "rain";
    r.style.left = (Math.random() * 100) + "%";
    r.style.animationDelay = (Math.random() * 0.6) + "s";
    panel.appendChild(r);
  }
}

/* One rAF kick starts the CSS animation pass. */
function kickAnimation(ov) {
  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(function () { ov.classList.add("go"); });
  } else {
    ov.classList.add("go");
  }
}

function hideOverlay() {
  const ov = $("overlay");
  ov.className = "overlay";
  ov.classList.remove("go", "show", "happy", "sad");
}

function runBlab() {
  const b = document.getElementById("blab");
  if (state.blabTimer && typeof clearTimeout !== "undefined") { clearTimeout(state.blabTimer); state.blabTimer = null; }
  if (!b || !b.classList) return;
  b.classList.remove("show");
  if (Math.random() < 0.01 && state.current) {
    const ok = state.current.options.filter(function (o) { return o.kind === "correct"; })[0];
    if (ok) {
      b.innerHTML = "Psst… the answer is \u201c" + escapeHtml(ok.text) + "\u201d <small>(don't tell her.)</small>";
      b.classList.add("show");
      if (typeof setTimeout !== "undefined") {
        state.blabTimer = setTimeout(function () { b.classList.remove("show"); state.blabTimer = null; }, 5000);
      }
    }
  }
}
function buddyMood() {
  const b = document.getElementById("buddy");
  if (!b || !b.setAttribute) return;
  b.setAttribute("data-mood", state.loseStreak >= 10 ? "angry" : state.loseStreak > 0 ? "sad" : state.streak > 0 ? "happy" : "neutral");
}
function updateFury() {
  const f = document.getElementById("fury"), box = document.getElementById("furyStat");
  if (!f || !box) return;
  f.textContent = state.loseStreak;
  box.className = "stat" + (state.loseStreak >= 10 ? " max" : state.loseStreak >= 7 ? " high" : state.loseStreak >= 4 ? " med" : state.loseStreak >= 1 ? " low" : "");
}
function advance() {
  state.idx += 1;
  nextQuestion();
}

function retryMissed() {
  if (!state.missed.length) return;
  state.queue = shuffle(state.missed.slice());
  state.missed = [];
  state.idx = 0; state.score = 0; state.streak = 0;
  state.right = 0; state.wrong = 0; state.trapHits = 0; state.loseStreak = 0;
  nextQuestion();
}

function endScreen() {
  const ov = $("overlay"), panel = $("panel");
  const total = state.right + state.wrong;
  const acc = total ? state.right / total : 1;
  const n = state.queue.length;
  let cls = "happy", face = HAPPY_SVG, banner = "";
  let head = "Round complete!", sub = "you finished " + n + " questions!";
  if (total > 0 && state.right === total) {
    banner = '<div class="streak-banner b5">FLAWLESS!</div>';
    head = "Flawless!";
    sub = "not a single miss across " + n + " questions!";
  } else if (acc >= 0.8) {
    banner = '<div class="streak-banner b5">' + (n >= 50 ? "MARATHON MASTER" : "HISTORY MASTER") + '</div>';
    head = "History Master!";
    sub = "superb work across " + n + " questions!";
  } else if (acc >= 0.5) {
    head = "Great round!";
    sub = "solid work across " + n + " questions!";
  } else if (acc >= 0.25) {
    cls = "sad";
    face = RELIEF_SVG;
    head = "Rough round…";
    sub = "the misses are listed below — go get them.";
  } else {
    cls = "sad";
    face = ANGRY_SVG;
    head = "Yikes.";
    sub = "retry the misses before she finds you.";
  }
  ov.className = "overlay " + cls + " show" + (face === ANGRY_SVG ? " trap-flash" : "");
  panel.innerHTML =
    banner +
    '<div class="char-wrap">' + face +
    '<div class="bubble">' + head + '<small>' + sub + '</small></div></div>' +
    '<p class="detail">Score <b>' + state.score + '</b> · ' + state.right + '/' + total +
    ' right · best streak ' + state.best + ' · traps walked into: ' + state.trapHits + '</p>' +
    (state.missed.length
      ? '<div class="miss-list"><span>Study these ' + state.missed.length + ':</span>' +
        state.missed.map(function (w) { return '<div><b>Q:</b> ' + escapeHtml(w.word) + '<br><b>A:</b> ' + escapeHtml(w.definition) + '</div>'; }).join('') + '</div>' +
        '<button id="retryBtn" type="button">Retry missed (' + state.missed.length + ')</button>'
      : '<p class="detail">Flawless — nothing to review!</p>') +
    '<button id="nextBtn" type="button">Play again</button>';
  if (cls === "happy") addSparkles(panel, banner ? 60 : 30); else addTears(panel, true);
  if ($("retryBtn")) $("retryBtn").addEventListener("click", retryMissed);
  $("nextBtn").addEventListener("click", function () { startGame(state.filter); });
  kickAnimation(ov);
  $("bar").style.width = "100%";
}

document.addEventListener("DOMContentLoaded", function () {
  $("weekFilter").addEventListener("change", function (e) { startGame(e.target.value); });
  /* study buddy watches the cursor and hops on click */
  (function () {
    const buddy = document.getElementById("buddy");
    if (!buddy || typeof buddy.getBoundingClientRect !== "function") return;
    const pupils = document.getElementById("buddyPupils");
    const bhead = document.getElementById("buddyHead");
    const calmMotion = (typeof window !== "undefined") && !!window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (calmMotion) return;
    let mx = (typeof innerWidth !== "undefined") ? innerWidth / 2 : 0;
    let my = 0, ticking = false;
    function buddyLook() {
      ticking = false;
      const r = buddy.getBoundingClientRect();
      const dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height / 2);
      const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      const px = (dx / d) * Math.min(4, d / 40), py = (dy / d) * Math.min(4, d / 40);
      if (pupils) pupils.setAttribute("transform", "translate(" + px.toFixed(1) + "," + py.toFixed(1) + ")");
      if (bhead) bhead.setAttribute("transform", "rotate(" + (Math.max(-6, Math.min(6, dx / 60))).toFixed(1) + " 60 55)");
    }
    document.addEventListener("mousemove", function (e) {
      mx = e.clientX; my = e.clientY;
      if (!ticking) { ticking = true; requestAnimationFrame(buddyLook); }
    });
    document.addEventListener("click", function () {
      buddy.classList.remove("hop");
      void buddy.offsetWidth;
      buddy.classList.add("hop");
    });
  })();
  $("countSelect").addEventListener("change", function (e) { state.count = e.target.value; startGame(state.filter); });
  $("restartBtn").addEventListener("click", function () { startGame(state.filter); });
  $("soundBtn").addEventListener("click", function (e) {
    soundOn = !soundOn;
    e.target.textContent = soundOn ? "Sound: on" : "Sound: off";
    if (!soundOn) killAudio();
  });
  $("musicBtn").addEventListener("click", function (e) {
    musicOn = !musicOn;
    e.target.textContent = musicOn ? "Music: on" : "Music: off";
    if (musicOn) startMusic(); else killAudio();
  });
  document.addEventListener("pointerdown", function bootMusic() {
    document.removeEventListener("pointerdown", bootMusic);
    startMusic();
  });
  startGame("all");
});

globalThis.__historyTrivia = { state: state, buildOptions: buildOptions, answer: answer, nextQuestion: nextQuestion, startGame: startGame };
</script>
