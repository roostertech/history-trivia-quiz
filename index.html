-fifths of Congress reserved southern, from the Compromise", "Each free person counting three-fifths to shrink large states", "Three-fifths of the trade banned at once, from northern laws", "Virginia gaining three senators per five, from New Jersey's plan", "The enslaved freed in three-fifths of states, from the Ordinance"], "example": "The 3/5 rule balanced north and south: extra southern seats, but fewer than full counting would give.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-16", "week": "t2l2", "word": "Why did many northern states object to counting enslaved people in population counts?", "definition": "The enslaved couldn't vote, so counting gifted seats south", "wrong": ["Counting them would force immediate emancipation in every single state, freeing them all", "They should count fully so the north itself would gain more seats", "Only property-owning white men should ever enter population counts", "Congress rather than the individual states should conduct the count", "Counting them excused Britain keeping its forts", "They should count for taxes, funds sent to France", "The census violated domestic tranquillity", "Rhode Island's absence should shrink southern totals", "Counting them demanded two-thirds votes per bill"], "example": "No vote, no count: the north saw slave-counting as inflated southern power in the House.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-17", "week": "t2l2", "word": "How did the Three-Fifths Compromise change Virginia's representation, estimated for 1790?", "definition": "Virginia counted 617,753 for twenty seats, not fifteen", "wrong": ["Virginia's 442,177 free residents alone granting 25 seats, cut down to 15 in the 1790 count", "Virginia counting 292,627 enslaved fully and leaping to 31 seats", "Virginia losing the count entirely, falling 43 seats to 31", "Virginia's mixed 617,753 count electing 25 senators", "The compromise granting Virginia 36 sections of land", "Virginia gaining 60,000 settlers, seeking statehood", "Virginia frozen at 15 as slave counting was banned", "The national capital moved, costing Virginia 12 seats", "Virginia keeping one Articles vote, 31 votes in total"], "example": "The worked example shows the bargain's price: Virginia +5 seats over free-only, −5 under full counting.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-18", "week": "t2l2", "word": "What further slavery compromises did northern and southern states reach over the slave trade and fugitives?", "definition": "No slave-trade ban for twenty years, plus a fugitive clause", "wrong": ["The slave trade banned at once in 1787 with full freedom granted in a year", "The south ending slavery in twenty years in exchange for payment", "Congress barred forever; fugitives freed in the north", "The north returning slave taxes; the south keeping trade", "The trade capped at three-fifths of ships; fugitives free", "The south banning the trade itself amid protests", "Britain deciding the trade after war debts were paid", "Fugitives granted jury trials; the trade moving west", "The trade taxed $640 per head with school sections"], "example": "Economy trumped ideals again: 20 protected years for the trade plus forced return — raising the ethical question of freedom beside slavery.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-19", "week": "t2l2", "word": "After signing, how would the Constitution take effect?", "definition": "Each state voted in convention; nine endorsements made law", "wrong": ["Congress approving by nine votes and enforcing the plan on all thirteen", "Washington signing alone with effect everywhere the very same day", "Parliament in London ratifying first before state conventions met", "All thirteen approved unanimously, as in the Articles", "Rhode Island alone decided, having skipped the Convention", "The Supreme Court reviewed it first, ordering compliance", "Three-fifths of voters petitioned in each state in time", "The French king countersigned before nine states voted", "Legislatures barred; only Congress could ratify"], "example": "Nine-state trigger via state conventions — creation began the ratification struggle of Lesson 4.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-20", "week": "t2l2", "word": "What do the Preamble's opening words 'We the People of the United States, in order to form a more perfect union...' signify?", "definition": "'We the People' vests power in the people, seeking union", "wrong": ["Listing the three branches and assigning them powers over the states", "Counting three-fifths of the people for the very first census", "Demanding nine states approve each and every amendment", "Stripping Congress of every power over slave imports for twenty full years to protect the trade", "Banning the slave trade for twenty years across the nation", "Letting Congress tax without consulting any council", "Fixing Rhode Island as the permanent national capital", "Barring state ratifying conventions forevermore", "Splitting large-state and small-state peoples"], "example": "'We the People' announces popular authority and union as the Constitution's first purpose.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L3-01", "week": "t2l3", "word": "What is a republic, the kind of government the delegates wanted to create?", "definition": "Citizens ruling together through elected representatives", "wrong": ["One person holding complete authority by claimed divine right of kings", "A king forced to obey Parliament and the courts under law", "States each keeping one vote whatever their size or people", "Citizens voting directly on every law at town meeting", "Three-fifths of the people electing a monarch for life", "The military placed permanently above civilian authority", "Judges depending entirely on the president's will", "Nine states approving every single decision unanimously", "The church establishing one official religion for all"], "example": "Few republics in history lasted long — so the Framers studied Greece and Rome to build one that would.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-02", "week": "t2l3", "word": "What is civic republicanism, the tradition the founders admired in the Roman Republic?", "definition": "Citizen participation promoting the community's well-being", "wrong": ["One ruler holding complete authority over the entire republic", "Only nobles allowed to serve in public office or own property", "Counting three-fifths of the people for representation", "Nine states required to approve taxes unanimously", "Citizens obeying laws but never helping make them", "The army choosing civilian leaders in wartime", "Ignorance and freedom naturally going together", "Republics falling only when invaded from outside", "One official church established for the nation"], "example": "Roman independence and public service — citizens serving from devotion, not personal gain — became the founders' ideal.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-03", "week": "t2l3", "word": "What warning did the founders take from the collapse of Rome's republic?", "definition": "Without devoted citizens, republics corrupt and decay from within", "wrong": ["Republics falling only to outside invasion, so build ever bigger armies", "Rome falling to slave-counting, so the founders banned all counting", "Rome falling to too much schooling, so Jefferson opposed public schools", "Rome fell through town meetings, so forbid self-rule", "Rome fell to a law-bound king, so free the President", "Rome fell to written laws, so keep frames unwritten", "Rome fell by women's property, so strip married rights", "Rome fell to trade laws, so ban Congress from commerce", "Rome fell to three branches, so merge all powers"], "example": "Historians say the founders exaggerated Rome's virtues, but the warning stands: decay from  in the Magna Carta, signed by King John of England in 1215, helped shape American government?", "definition": "Monarchs obey; noble jury and property rights spread", "wrong": ["Kings blithely taxing whatever they wished while nobles held no rights at all", "Elections banned outright and jury trial denied to everyone", "Kings owning all property; habeas corpus abolished", "Citizens bearing arms for the king; church running courts", "Three branches created at once with executive judges", "Three-fifths counted for taxes; trade banned for years", "Kings answering to no council; towns barred from meeting", "All power to Parliament; monarchy abolished in 1215", "Property outlawed; only kings claiming juries"], "example": "Law-above-king plus protected rights seeded both limited government and free enterprise in America.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-07", "week": "t2l3", "word": "How did the Magna Carta's tax clause point toward Parliament?", "definition": "John barred taxes without his Great Council", "wrong": ["Parliament gaining the power to tax America without its consent", "Every tax abolished forever and the Great Council disbanded", "Nine American states approving each tax before it took effect", "Three-fifths of property taxed for Crusades", "The Council electing a new king every two years", "The Council quartering troops in every home", "The Council barred from meeting after 1215", "Council seats sold off for 640 acres each", "The Council vetoing church appointments"], "example": "No taxes without consultation: the ancestor of 'no taxation without representation' and of legislatures checking rulers.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-08", "week": "t2l3", "word": "What did the English Bill of Rights of 1689 add beyond the Magna Carta?", "definition": "Elections, juries, some arms, habeas corpus — beyond 1215", "wrong": ["Parliament abolished and the king's unlimited taxing power fully restored", "Jury trials ended and jailing without any charge allowed", "Arms banned for everyone and every court in England closed", "Three-fifths of all prisoners counted for seats in Parliament", "Kings vetoing Congress and colonial assemblies", "Thirteen-state unanimity for every law passed", "Slavery founded; the trade banned in colonies", "Elections banned; judges serving the king", "Townships taxed $640 per section for the Crown"], "example": "1689 went further than 1215 in protecting citizens — the document William and Mary received in the engraving.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-09", "week": "t2l3", "word": "What is habeas corpus, affirmed in the English Bill of Rights?", "definition": "No jailing anyone without a criminal charge", "wrong": ["Kings raising whatever taxes they fancied without consulting any council", "Parliament vetoing the laws passed by the colonies", "Three-fifths of prisoners counted for taxes", "Judges serving at the president's pleasure", "Soldiers housed in private homes without consent", "The church establishing an official religion", "Nine states approving every criminal trial", "Nobles inheriting their legislature seats", "Elections suspended for the whole wartime"], "example": "Charge-or-release: a core liberty the Framers carried from English tradition into American law.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-10", "week": "t2l3", "word": "What were John Locke's two great ideas in Two Treatises of Government (1690)?", "definition": "Life, liberty, property; ruler-ruled pact allows revolt", "wrong": ["All earthly power flowing divinely to kings, the people never questioning it", "Three branches needed, with every tax passing unanimously", "People owning nothing; rulers jailing at will", "Liberty as obeying Parliament; nobles owning all", "Rulers chosen by lot; rebellion always forbidden", "Rights for church members only; kings divinely wise", "Life granted by Congress; property three-fifths held", "Monarchy forever; the contract never broken", "Rights from the Bill alone; rebellion over with Rome"], "example": "Locke's natural rights and ruler-ruled agreement made revolution justifiable — and made the Constitution a contract.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-11", "week": "t2l3", "word": "How did Locke's ideas shape the Constitution's protection of property and business?", "definition": "Property and enterprise shielded, plus commerce power", "wrong": ["All private property banned outright and handed over to Congress by the Convention", "Congress forbidden to regulate any trade whatsoever", "All property split in 36 sections to be sold to government", "Business capped at three-fifths of approved merchants", "Contracts taxed $640; interstate shipping banned", "Only kings owning land or enforcing deals", "Commerce to militias; Congress printing worthless dollars", "Property reserved for nobles, as back in 1215", "Locke rejected; Britain regulating all trade"], "example": "Locke-to-commerce: property and contract guarantees plus the commerce power built thriving free enterprise.", "lesson": "Topic 2 · Lesson 3: Ideas That Influenced the Constitution"}, {"id": "L3-12", "week": "t2l3", "word": "What did Charles-Louis Montesquieu argue in The Spirit of the Laws (1748)?", "definition": "Powers divided: lawmakers pass, executives execute", "wrong": ["One wise king holding every power undefined for the sake of speed, as in 1748", "Two houses sufficing, with both apportioned strictly by population", "The people voting on every law at their town meetings", "No courts needed, with legislatures judging themselves", "Three-fifths of power southern, the rest northern", "Executives passing laws; legislatures executing", "Powers kept secret from questioning citizens", "The church defining powers; priests judging all", "Nine states nce for funding the Revolution against Britain", "The coming Bill of Rights was made far too long to memorize", "Rhode Island gained veto power over all twelve other states", "Unanimous votes were demanded so the government froze solid", "State governments were banned and all moved to the capital", "The Supreme Court gained veto power over every state election", "Washington was crowned king for life with no election ever held"], "example": "Even expecting honorable Washington as first President, Antifederalists warned future Presidents might lack his honor and skill.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-04", "week": "t2l4", "word": "What were the Federalist Papers, and why do they still matter?", "definition": "Madison, Hamilton, and Jay: pen-name essays defending the plan, cited still", "wrong": ["Patrick Henry's fiery anti-ratification pamphlets, which are still read as Virginia law even today", "Fierce newspaper attacks on Washington's presidency, still quoted in every campaign season", "Madison's twelve proposed amendments, which are still pending today before the states", "Secret Convention journals published at once, still sealed away today in the archives", "British essays defending the king, still cited against America", "1776 collections of state bills of rights, still binding Congress", "Love letters between delegates, still displayed in Philadelphia", "The first federal tax codes, still collected the same way", "Military orders from Yorktown, still obeyed by the Guard"], "example": "Among the best discussions of American political theory — written to win ratification, lasting as judicial guidance.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-05", "week": "t2l4", "word": "Who was Alexander Hamilton, author of more than 50 of the 85 Federalist Papers?", "definition": "Nevis-born New Yorker, 50+ essays, Treasury chief, killed by Burr", "wrong": ["The Virginia planter who wrote the 1776 state bill of rights and fiercely opposed ratification ever since", "The soft-spoken Virginian who out-argued Henry's seven-hour speeches", "The Pennsylvanian who carried ratification days after Delaware voted", "The patriot who held Massachusetts out for a rights pledge", "The Frenchman of Brandywine who secured thousands of soldiers", "The Prussian who drilled Washington's troops to march", "The Chief Justice who founded review in Marbury", "The President impeached by the House but acquitted", "The governor who flipped Virginia to ratify in June"], "example": "Hamilton at 14 ran a St. Croix business managing older men — precocity that carried into treasury and tragedy.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-06", "week": "t2l4", "word": "What was the Antifederalists' chief objection to the Constitution?", "definition": "The plan listed no guaranteed protections of individual rights anywhere at all", "wrong": ["Three separate branches created instead of Congress ruling over everything itself", "One vote per state kept in place whatever each state's size or population might be", "Nine states were needed rather than all thirteen", "Three-fifths of the enslaved were counted in the census", "Congress was allowed to regulate trade between states", "Conventions were set up instead of legislatures voting", "New York City was named the nation's first capital", "The Vice President was set to preside over the Senate", "Presidents were allowed to pardon federal offenders"], "example": "No Declaration of Rights: the missing list dominated every state debate.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-07", "week": "t2l4", "word": "How did Federalists answer the demand for a bill of rights, and how did Antifederalists reply?", "definition": "All rights can't be listed; speech and religion must be spelled out", "wrong":  and what was his pamphlet 'Objections to This Constitution of Government' about?", "definition": "Virginia's 1776 bill author turned foe, crying 'No Declaration of Rights'", "wrong": ["The New Yorker behind most of the pro-plan Federalist essays defending strong government in 1787 and 1788", "The Pennsylvanian who carried ratification only days after Delaware had voted first", "The governor who flipped to ratify on a rights pledge", "The patriot who demanded the bill before backing ratification", "The Frenchman who split power three ways back in 1748", "The Englishman declaring life, liberty, and property", "The Connecticut man compromising representation in July", "The Treasury chief who fell to Burr's duel in 1804", "The Chief Justice who later founded judicial review"], "example": "Mason embodied the Antifederalist case: a bills-of-rights author confronting a Constitution without one.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-10", "week": "t2l4", "word": "Which states led ratification in the fast start of winter 1787–1788, and by what votes?", "definition": "Delaware first (30–0), then Pennsylvania (46–23), then New Jersey", "wrong": ["Rhode Island voting 34–32 first of all, then North Carolina next, then New York eventually in that order", "Virginia voting 89–79 first, then Massachusetts, then New Hampshire after them", "Massachusetts unanimous first, Delaware trailing months later", "New York 30–27 first, then Virginia, New Hampshire ninth", "All thirteen together on July 4, 1788 at the parade", "No state voting until Rhode Island in May 1790", "Pennsylvania 38–0 first, Delaware 30–0 second", "Georgia refusing while Connecticut stood alone south", "New Jersey holding out for rights before 46–23"], "example": "Small-state sprint: Delaware's unanimous 30–0 opened a winter of Federalist momentum.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-11", "week": "t2l4", "word": "How was Massachusetts, the first key battleground, won over in February 1788?", "definition": "Adams and Hancock held out for a rights pledge; sixth, February 1788", "wrong": ["Washington threatening a full invasion, so the convention's vote went completely unanimous at once", "Hamilton's brilliant essays flipping every single foe of the plan overnight", "The entire national capital pledged permanently to the city of Boston", "Rhode Island's vote shamed Massachusetts into voting next", "Debate was banned outright and the vote went 30–0", "Madison spoke seven hours straight until Henry yielded", "Three-fifths counting was demanded before any vote", "Congress forgave the whole Massachusetts debt load", "Britain offered rich trade deals for rejection"], "example": "'Don't take a leap in the dark' vs 'gather fruit when ripe' — the bill-of-rights promise ripened the vote.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-12", "week": "t2l4", "word": "When did the Constitution officially take effect, and why did unity remain in doubt?", "definition": "New Hampshire's June 1788 vote made nine; Virginia, New York loomed", "wrong": ["Delaware's December 1787 vote making one single small state legally and fully enough for everyone involved", "All effect waiting patiently for Rhode Island, the very last state, in 1790", "Massachusetts' convention vote proving ninth and ending all doubt at once", "All legal effect beginning only with Washington's 1789 election victory", "Virginia's vote was ninth; New Hampshire's moot", "All thirteen required, so nothing until 1790", "The July 1788 parade legally enacted the frame", "Effect waited for the 1791 Bill of Rights", "New York's was ninth; Virginia's meaningless"], "example": "Nine was legal; Virginia-plus-New-York was real — ratification needed the giants to hold the union.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-13", "week": "t2l4", "word": "How did Virginia finally ratify in late June, despite Henry, Mason, and Randolph's opposition?", "definition": "Henry thundered, Madison answered, Randolph flipped, Virginia ratified", "wrong": ["Henry's magnificent seven-hour speech converting Madison to abandon the whole plan entirely", "Washington ordering ratification through with no debate allowed at all, swiftly", "Mason's pamphlet flipped the Federalists against it", "Randolph demanded the capital as his switching price", "The vote went 30–0 after Hancock's pledge", "Virginia refused outright until the 1791 Bill", "Henry dueled Madison and the survivor cast one vote", "France threatened debt collection over delay", "The vote paused twenty years over the trade"], "example": "Drama vs clarity: Henry's thunder lost to Madison's patience plus the bill-of-rights pledge.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-14", "week": "t2l4", "word": "How did the ratification struggle end in New York, North Carolina, and Rhode Island?", "definition": "New York 1788, Carolina 1789, boycotting Rhode Island last 1790", "wrong": ["All three trailing states voting together in December of 1787, well ahead of little Delaware that year", "New York rejecting the constitutional plan forever while the others voted at once", "Rhode Island first while New York held out to 1791", "Carolina never ratifying and outside the frame today", "New York 34–32 while Rhode Island voted 30–27", "All three demanding a king before considering", "Washington forcing all three by 1788 order", "The three seceding into their own confederation", "Ratification ending at Massachusetts sixth"], "example": "A year and a half from Delaware to Rhode Island: the same basic system still in effect today.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-15", "week": "t2l4", "word": "What factor encouraged many states to vote for ratification?", "definition": "Better-government talk plus rights pledges won the holdouts", "wrong": ["Blunt army threats leveled against any state daring to vote no on the whole ratification question", "Western-land bribes quietly paid out to every convention delegate", "Solemn public promises to abolish every single tax forevermore", "British pressure to resume the king's trade", "Abstaining states losing all representation", "French loans paid only for yes votes", "The capital rotating to each yes state in turn", "The Bill already law before any state voted", "Washington banning all debate before votes"], "example": "Persuasion plus pledge: better government now, guaranteed rights next — celebrated from Philadelphia's eagle carriage to New York's parade.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-16", "week": "t2l4", "word": "What happened in the first election under the Constitution in January 1789?", "definition": "Washington President, Adams VP, Congress meeting in New York", "wrong": ["Adams taking the presidency and Hamilton the vice presidency, governing together from Philadelphia", "Washington crowned as king and Congress abolished as wholly needless", "Jefferson beating Washington outright in a deadlocked electoral college", "No election held at all, with only nine states having ratified", "Thirteen presidents chosen, one per state delegation", "Congress in Philadelphia refusing all amendments", "The people voting directly by national popular ballot", "Rhode Island's boycott voiding the whole election", "The Senate picking Presidents, the House Vice Presidents"], "example": "As expected, Washington: the new framework's first test was an election, its first business the promised rights.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-17", "week": "t2l4", "word": "How can the Constitution be amended, and how was the Bill of Rights added?", "definition": "Madison's 12 proposed in 1789; 10 ratified by December 1791", "wrong": ["The sitting President amending the whole constitutional frame all alone through a single sweeping executive order", "Congress amending the whole frame overnight by a simple majority vote", "Nine states proposing 20, all effective in 1789", "Madison writing 10 while states rejected two forever", "The Court amending the frame by voiding old laws", "Three-fifths of one state amending for the nation", "Amendment impossible, the 1791 acts illegal", "The Bill preceding ratification to win Delaware", "Twelve proposed with all twelve ratified by 1791"], "example": "12 proposed, 10 ratified: the difficult process worked exactly as designed — deliberately, then decisively.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-18", "week": "t2l4", "word": "What did Madison insist the Bill of Rights does NOT do?", "definition": "Rights preexist; the Bill only bars government taking them", "wrong": ["Freedom of speech deliberately left completely out of the First Amendment by every one of the founders", "It granting sweeping brand-new rights unknown anywhere before 1791", "It binds the states only, never the federal frame", "Simple majorities may repeal it any session", "It covers propertied white men over 21 only", "It expired twenty years after ratification", "It guards only the President's veto power", "Hamilton wrote it inside the Federalist Papers", "It lists all rights so no others can exist"], "example": "Natural rights preexist government: the Bill is a lock on the door, not the house itself.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-19", "week": "t2l4", "word": "How did the Third, Sixth, and Seventh Amendments answer abuses under British rule condemned in the Declaration?", "definition": "Forbidding forced quartering; securing jury trials", "wrong": ["Every standing army banned outright and every single court in the whole nation closed forevermore", "Presidents left entirely free to quarter troops and suspend all juries", "Precious jury rights carefully reserved for federal officers alone", "Congress free to house soldiers in peacetime", "Grievances repealed along with the Declaration", "Only religion and press were protected", "Soldiers counted three-fifths for billeting", "Nine states voting to suspend juries in war", "All trials moved to New York for supervision"], "example": "Old wounds, new shields: each listed abuse got its matching amendment.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "L4-20", "week": "t2l4", "word": "What religious-freedom story sits behind the First Amendment?", "definition": "Jefferson's 1786 Statute; Madison beat Henry's church plan", "wrong": ["Christianity formally established as the one national religion with Patrick Henry's full blessing", "The old Virginia statute compelling churchgoing and payment of tithes", "Madison himself strangely backing Henry on Christians-only public office", "Free speech alone protected, with religion left completely untouched", "The statute following the 1791 Bill of Rights", "Congress ordered to fund all churches equally", "Worship banned outside the home", "Henry writing it while Jefferson opposed separation", "Government free to punish speech but never religion"], "example": "Virginia's 1786 statute to the First Amendment: Madison's separation beat Henry's establishment — with speech secured beside it.", "lesson": "Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights"}, {"id": "T2L5-01", "week": "t2l5", "word": "What are the six goals stated in the Preamble of the Constitution?", "definition": "Union, justice, peace, defense, welfare, liberty: six goals", "wrong": ["Winning independence, raising armies, printing money, banning slavery, electing kings, building capitals", "Union, state taxes, closed ports, high tariffs, and navies", "Justice, congressional trials, jailed debtors, seized farms", "Tranquillity through protest bans, censorship, and quartering", "Defense through permanent military rule over civilians", "Welfare through Congress running schools and hospitals", "Liberty reserved for property owners alone", "Thirteen kings, each sovereign over one colony", "No states, no courts, no presidency at all"], "example": "Six goals open the document: union, justice, peace, defense, welfare, liberty.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-02", "week": "t2l5", "word": "What do 'a more perfect union' and 'establish justice' mean as Preamble goals?", "definition": "One nation undivided, with one fair legal code", "wrong": ["Every single state printing its very own money while each one runs its own separate court systems", "A fond reunion with Britain under judges appointed directly by the Crown", "Thirteen armies serving thirteen generals", "One state absorbing the other twelve", "Borders erased for taxes; Congress trying all crimes", "The President ruling states directly; juries abolished", "Free state coinage; trials for owners only", "French alliances; foreign courts judging us", "The capital moving yearly; counties writing frames"], "example": "From separate-nations to one nation under one fair law: the Preamble's first two promises.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-03", "week": "t2l5", "word": "What do the Preamble goals of domestic tranquillity, common defense, general welfare, and liberty mean?", "definition": "Domestic peace, civilian defense, general welfare, liberty via amendment", "wrong": ["Banned protests, direct military rule, soldiers-only welfare, with freedom over in 1791", "Separate state armies, no navy at all, Congress farming, liberty for voters only", "Closed borders, mercenary defense, printed money, liberty dropped", "Presidents commanding governors, state armies, church health, no amendments", "Silent courts, British protection, tariff welfare, property-only liberty", "Hushed Congress, disbanded militias, banned science, the king's liberty", "Quiet secession, forts only, gold reserves, a censored press", "Permanent martial law, no civilian control, NIH gone, no amendments", "Guard abroad only, Congress surrendering, states paying, ended liberty"], "example": "Peace at home, strength abroad under civilians, well-being for all, freedom widened by amendment.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-04", "week": "t2l5", "word": "What does each of the Constitution's seven articles do?", "definition": "Articles 1–3 raise branches; 4 binds states; 5 amends; 6 crowns", "wrong": ["Article 1 banning every single tax, Article 2 crowning new kings, Article 3 killing all the courts", "All seven articles describing Congress; President and courts added later on", "Elections, coinage, war declarations, then amendments, in that very order", "Township division, $640 section sales, school reservations", "Banning states, forbidding amendments, bowing to states", "Goals alone as enforceable law in Article 7", "Counting three-fifths and assigning one vote each", "Branches expiring in 1791; only amendments surviving", "Salaries fixed per article and nothing else"], "example": "Short framework: three branches, states' relations, change, supremacy, ratification — plus 27 amendments over 200+ years.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-05", "week": "t2l5", "word": "What does the 'supreme law of the land' in Article 6 mean in practice?", "definition": "Federal law always beats conflicting state law", "wrong": ["State law always beating any conflicting federal law in every single dispute arising", "The Court passing any law without Congress", "Presidential orders overriding the frame itself", "Post-1791 amendments ignorable by states", "Federal law only in the capital and bases", "State high courts above the U.S. Supreme Court", "The Articles still supreme over the frame", "British law filling Treaty of Paris silences", "Supremacy expiring every twenty years"], "example": "Supremacy settles conflicts upward: Constitution first, then federal law over state law.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-06", "week": "t2l5", "word": "What are the seven basic principles reflected in the Constitution?", "definition": "Sovereignty, limits, separation, checks, federalism, republic, rights", "wrong": ["Monarchy, divine right, standing armies, an established church, censors, heavy taxes, and endless conquest", "Three-fifths counting, long delays, unanimity rule, one house, sweeping vetoes", "Plans, compromises, and two conventions", "Preamble, articles, amendments, nine states", "House, Senate, President, Cabinet, courts, Guard, college", "Taxes, armies, navies, posts, weights, war powers", "Factions from Federalist through enemy", "Life, liberty, property, rebellion, contract", "Delaware through Massachusetts"], "example": "Seven principles, one system: the vocabulary the rest of the lesson unpacks branch by branch.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-07", "week": "t2l5", "word": "What do popular sovereignty and limited government mean?", "definition": "People grant and may retake power; government stays limited", "wrong": ["Kings ruling only by direct personal grant of God with truly boundless and unquestioned power forever", "The states ruling the people while the people only ever obey the states", "Congress sovereign over its own voters", "Presidents owning power beyond review", "Only owners counting as the people", "Nine states ruling four; four ignoring law", "The military commanding civilians", "The church granting power above law", "Government facing no restrictions at all"], "example": "Revolutionary reversal: power flows up from people, and law binds the rulers too.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-08", "week": "t2l5", "word": "How does the Constitution divide power through separation of powers and federalism?", "definition": "Congress makes, President executes, courts judge; power split", "wrong": ["Congress busily executing all the laws, Presidents making them all, and courts commanding armies", "Presidents holding every power while the states merely collect taxes", "Courts busily legislating, Congress judging, Presidents reviewing everything", "States coining and warring while Congress schools", "Branches isolated; states seceding freely", "Delegated powers state-held; state powers Congress-held", "Sharing banned; every power single-homed forever", "Federals ruling states through governors", "Dual rule meaning two simultaneous Presidents"], "example": "Two divisions at once: three branches across, federal-plus-states down — each a fence against concentrated power.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-09", "week": "t2l5", "word": "What is republicanism and how does the checks system guard it?", "definition": "Citizens elect representatives; branches check each other", "wrong": ["Citizens personally voting on every single proposed law directly, with no agents at all between them ever", "Presidents inheriting high office and personally naming their agents", "Branches meekly obeying the other two branches without question", "The standing peacetime military overseeing all three branches", "Republicanism expiring with the 1791 Bill", "Unanimity required before any branch acts", "One party only ever holding office", "States vetoing federal branches at will", "Representation concentrating one leader"], "example": "Elect, don't crowd-source: representation plus mutual limits keeps the republic standing.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-10", "week": "t2l5", "word": "How is the House of Representatives organized under Article I?", "definition": "435 seats, one-plus each state, biennial terms", "wrong": ["Two senators per state serving staggered six-year overlaps, with the Vice President presiding and leading", "435 legislator-picked lifers led by the Chief Justice", "One per state equally, elected every six years", "The smaller body with two votes per state always", "Four-year terms with no reelection ever", "Senate-elected Speaker commanding the forces", "Seats by taxes paid with contributions buying in", "435 seats per state whatever the population", "Meeting only on presidential special call"], "example": "Population, two years, Speaker: the people's house, frequently accountable.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-11", "week": "t2l5", "word": "How is the Senate organized, and how did the Seventeenth Amendment change it?", "definition": "Two per state, staggered, elected since 1913", "wrong": ["Population-based seats, 435 members in total, with short two-year Speaker terms in place", "Legislator-picked senators forever; the 1913 act killing the Senate dead", "Four-year non-overlapping terms under the Chief Justice", "One governor-picked lifer serving per state", "1913 seats gifted to Speaker and Vice President", "Vice Presidents debating and voting every bill", "No overlaps at all; total turnover each six years", "Presidential appointees with no state role", "Equal seats dropped in 1913 for population"], "example": "Equal states, staggered experience, democratized in 1913: the Senate's stabilizing design.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-12", "week": "t2l5", "word": "How does a bill become law, and what must appropriations bills do first?", "definition": "Either house starts bills, money first; both approve, President signs", "wrong": ["The Senate alone starting every single bill; with one single passage and with no President ever needed", "The courts starting all bills; nine states approving; Presidents vetoing", "Money first in the Senate on three-fifths votes", "One chamber plus Speaker and VP suffices", "Proposal alone enacts; debate stays ceremony", "Presidents writing all bills; Congress applauding", "Unanimity plus three-fourths of states needed", "Money bills forbidden; no funds ever set aside", "The electoral college ratifying each bill"], "example": "House holds the purse's first move; two chambers plus the President make a law.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-13", "week": "t2l5", "word": "What powers does Article I, Section 8 give Congress, and what is the elastic clause?", "definition": "Borrow, tax, coin, war, commerce, plus necessary-and-proper reach", "wrong": ["Commanding all the armies, judging every single case, treating with foreign nations, pardoning, and freely vetoing", "Unlimited taxing, endless money printing, port-closing, trade-banning", "War powers only, with absolutely everything else the President's alone", "Regulating religion, churches, speech, quartering", "State coinage only; never borrowing or taxing", "The clause banning every unlisted power forever", "States stretching federal powers at will", "Commerce covering farms, never trade", "Tribes granted authority over Congress"], "example": "Listed powers plus stretch: Section 8 funds, defends, connects — and adapts.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-14", "week": "t2l5", "word": "How has Congress used the commerce clause's words 'and with the Indian tribes'?", "definition": "Tribes independent at writing; Congress took full charge", "wrong": ["Every tribal nation granted full authority over every one of Congress's trade decisions forevermore", "Every ounce of tribal trade banned forever and always", "Five whole tribal states admitted to the union all at once", "The tribes themselves ratifying the frame before it took effect", "Tribal lands exempt from all federal law", "Chiefs seated in Congress with full votes", "Tribal lands split into $640 sections", "Congress barred from tribal contact", "The phrase expiring after twenty years"], "example": "Three words, large consequence: from independence acknowledged to authority assumed.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-15", "week": "t2l5", "word": "What does the President do as head of the Article II executive branch?", "definition": "Executes laws; diplomacy, command, pardons", "wrong": ["Legislating completely alone, judging every single case, coining money, and single-handedly war-making", "Commanding armies but barred from diplomacy", "Chief-judging every Supreme Court decision", "Presiding, debating, and voting each Senate bill", "Tax-collecting personally, decreeing measures", "Divine rule with parade duties only", "Co-presidents tripling the office via the House", "Unlimited terms with named successors", "Enforcing state law while governors take federal"], "example": "Fewer constitutional details than Congress gets — but Washington onward, Presidents shaped the job by doing what it takes.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-16", "week": "t2l5", "word": "How is the President elected, and what limits service?", "definition": "Four-year terms, two-term cap; pledged electors decide", "wrong": ["The direct national popular vote alone deciding everything, with unlimited terms allowed forever", "Congress itself electing Presidents biennially without any limits at all", "The Court appointing Presidents for life", "One elector per state; six-year terms", "Electors pledged against their states' winners", "House picking Presidents, Senate Vice Presidents", "Six-year terms with a three-term 1913 cap", "The college meeting before Election Day", "Majority meaning 75 percent, else the House"], "example": "Electors, not direct votes: the Framers' complex filter — majority of electoral votes wins.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-17", "week": "t2l5", "word": "Why can a candidate lose the national popular vote yet become President, and has it happened?", "definition": "Winner-take-all splits votes; five cases, incl. 2016", "wrong": ["National popular votes never counted at all, which means every winner loses purely by evil design", "Congress overturning every electoral college that its own party loses", "The high Court deliberately awarding defeated losers the office", "Never happened; the frame forbids it", "Senate tie-breaks deciding each such race", "Three-fifths popular math crowning losers", "The House electing whenever winners win votes", "Electors bound nationally; splits impossible", "Senates deciding 2016 for lack of majority"], "example": "The college's known quirk: state-by-state winner-take-all can split the two majorities.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-18", "week": "t2l5", "word": "How is the federal judiciary organized under Article III?", "definition": "District trials, appeals, life-tenured last resort", "wrong": ["There is nothing but lowly district courts, with Congress itself grandly serving as the high court", "Presidents appointing every federal judge for mere four-year terms", "Districts reviewing appeals; high court trying cases", "Three biennial Justices deciding thousands", "Appellate juries hearing evidence; districts reviewing", "Judges popularly elected for six-year terms", "All 7,000-plus petitions heard without exception", "Unanimous nine-vote decisions required", "Congress trying cases with the VP presiding"], "example": "Trial, review, final word: district evidence, appellate law-check, Supreme last resort.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-19", "week": "t2l5", "word": "What is judicial review, and where did the Supreme Court get it?", "definition": "Voiding unconstitutional acts and laws; Marbury 1803", "wrong": ["Congress freely removing sitting Presidents at will, exactly as supposedly set back in 1789", "Presidents vetoing high Court decisions, as set by Washington himself", "States nullifying federal law, set in the Articles", "Courts writing laws directly, set in the Bill", "Voters recalling Justices, set in 1913", "Senates trying Presidents, set in Article I", "Courts commanding armies, set at Yorktown", "Listed plainly in Article III's first line, 1787", "Amending the frame with no state role"], "example": "The Court's great implied power — to void laws — balanced by removal, and by having neither purse nor sword.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "T2L5-20", "week": "t2l5", "word": "How do the branches check each other, including the most extreme check on a President?", "definition": "Veto, override; House charges, Senate trial", "wrong": ["Congress itself vetoing laws while Presidents override them quite simply; with courts vetoing freely", "Presidents dissolving Congress with no recourse", "Courts overriding vetoes five votes over all", "Impeachment removing instantly without trial", "Johnson and Clinton convicted and removed", "Treaties and appointees needing no approval", "Two-thirds meaning three-fifths; vetoes absolute", "The military reviewing every law and verdict", "Checks applying in wartime only"], "example": "Veto, override, confirm, review, impeach: separated powers make mutual checking possible.", "lesson": "Topic 2 · Lesson 5: Understanding the Constitution"}, {"id": "L6-01", "week": "t2l6", "word": "Which five freedoms does the First Amendment protect?", "definition": "Speech, press, religion, assembly, and petition", "wrong": ["Bear arms, quarter troops, speedy trials, grand juries, and just bail", "Speech, press, arms, jury trial, and voting in every election", "Religion, assembly, petition, counsel, and confronting witnesses", "Press, speech, property, contracts, and free trade between states", "Life, liberty, property, rebellion, and the pursuit of happiness", "Vote, bear arms, and be tried only by judges", "Due process and equal protection", "A well-regulated militia mustering to petition Congress for redress with counsel present", "No soldier quartered, no tax levied, no search made without nine states signing"], "example": "The First counts five: speak, print, worship, gather, and ask. The rest belong to later amendments.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-02", "week": "t2l6", "word": "What do assembly and petition guarantee?", "definition": "Peaceful gathering plus asking government to fix wrongs", "wrong": ["Gathering with arms and forcing Congress to adjourn", "Petitioning the king of England for new charters", "Voting directly on each law at annual town meetings", "Assembling an army and petitioning foreign kings for aid", "A free press printing anything without ever being sued", "The right of armed citizens to gather at polling places and oversee the count", "Freedom of worship for every faith, with no religious test for office", "A citizen's right to demand a bill of rights before ratifying anything", "Jury trial in every criminal and civil case"], "example": "Assembly means gather peacefully; petition, a formal ask that government right wrongs.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-03", "week": "t2l6", "word": "What does the Second Amendment protect?", "definition": "The right of the people to keep and bear arms, tied to militia service", "wrong": ["A large standing army controlled by Congress", "Arms for soldiers only, never for citizens", "The right to bear arms against the government", "Muskets for militias, with all other guns banned", "Quartering armed troops in private homes", "The English Bill of Rights of 1689, applied word for word, guarding arms for Protestants alone", "Every citizen serving two years in the forces and keeping the service weapon at home", "The federal power to disarm any state militia it distrusts", "Free hunting on all public and private lands"], "example": "It guards private arms-keeping, prefacing it with militia necessity; debate since centers on that link.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-04", "week": "t2l6", "word": "Why does the Second Amendment mention a well regulated Militia?", "definition": "Framers tied the right to citizen-soldiers defending the community", "wrong": ["It creates a federal draft for overseas wars", "It bans all guns except army-issue muskets", "It requires every town to hire mercenaries", "It gives Congress command of state militias", "It limits arms to peacetime hunting only", "Militias were colonial citizen-soldiers, minutemen drilling on village greens against invasion", "The clause was added in 1913 to build the National Guard under dual state-federal control", "It orders states to quarter militiamen in homes", "It lets the President disband militias at will"], "example": "The prefatory clause roots the right in armed citizens, not standing armies.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-05", "week": "t2l6", "word": "What does the Third Amendment forbid?", "definition": "Quartering soldiers in homes without the owner's consent", "wrong": ["Housing travelers in inns without payment", "Basing troops at forts near cities", "Colonists trading with soldiers on credit", "The king's troops wearing red coats in public", "Parliament taxing the colonies to pay troops", "British practice before 1776 of forcing families to feed, bed, and fuel redcoats under orders", "The Declaration's grievance that George III kept standing armies among civilians in peacetime", "States refusing to contribute militia to Congress", "Congress housing delegates during sessions"], "example": "Born of royal quartering abuses named in the Declaration; consent is the hinge.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-06", "week": "t2l6", "word": "What does the Third Amendment say about wartime?", "definition": "In war, quartering only as Congress prescribes by law", "wrong": ["In war the President may house troops anywhere", "Wartime quartering needs no law at all", "War abolishes the amendment entirely", "Generals decide quartering by decree", "States may quarter enemy troops freely", "The Framers, fresh from a war where redcoats seized homes and stores, left wartime rules to Congress", "British commanders in occupied Boston and New York routinely emptied houses and barns for their men", "Congress must build barracks before declaring war", "Militias house themselves wherever they march"], "example": "Peacetime: never without consent. Wartime: only Congress, by law — never commanders' whim.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-07", "week": "t2l6", "word": "What does the Fourth Amendment secure against unreasonable search?", "definition": "The persons, houses, papers, and effects of the people", "wrong": ["Towns, roads, and bridges", "Ships and cargoes at sea", "Public speeches and newspapers", "Muskets and militia armories", "Ballots and ballot boxes", "Royal customs officers with general warrants ransacking homes, shops, and warehouses for smuggled goods", "British writs of assistance letting officers search anywhere, anytime, without ever naming a place", "Only the homes of British officials", "Tax records held by Parliament"], "example": "Four named things — body, home, documents, belongings — the targets of hated writs of assistance.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-08", "week": "t2l6", "word": "What must a valid search warrant have?", "definition": "Probable cause, sworn oath, and particular place, persons, things", "wrong": ["A hunch and a signature", "The king's seal", "A majority vote of Congress", "Payment of a fee to the court", "Permission from the town meeting", "Colonial judges issuing blank general warrants good for any house, targets filled in later", "Parliament's writs of assistance, transferable officer to officer and never expiring, used on smugglers", "A note from the local sheriff", "Three witnesses swearing together"], "example": "Cause plus oath plus specifics — each word answers a named colonial abuse.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-09", "week": "t2l6", "word": "Which three criminal protections sit in the Fifth Amendment?", "definition": "Grand-jury indictment, no double jeopardy, no forced self-witness", "wrong": ["Speedy trial, jury, and counsel", "Bail, fines, and punishment limits", "Search warrants and seizures", "Free press and assembly", "Voting and office-holding", "Being tried twice for the same crime after acquittal, giving prosecutors a second chance", "Forcing confessions by oath in Star Chamber style, making the accused testify against themselves", "Civil jury trials over twenty dollars", "Quartering grand jurors in private homes"], "example": "Indictment by grand jury, one jeopardy per offense, silence before accusers.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-10", "week": "t2l6", "word": "What do the Fifth Amendment's closing clauses guarantee?", "definition": "Due process before losing life, liberty, or property; takings paid for", "wrong": ["Free schools for every child", "A jury in every civil case", "The vote at eighteen", "No taxes without consent", "Guns for every household", "Due process meaning any procedure Congress finds convenient during wartime or rebellion", "Just compensation measured as sentimental value plus tripled future profits", "Life tenure for all federal judges", "Citizenship for the enslaved"], "example": "Fair procedures first; if government takes land for public use, it pays.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-11", "week": "t2l6", "word": "What trial rights open the Sixth Amendment?", "definition": "Speedy public trial by an impartial jury, told the charge", "wrong": ["Secret trials before judges only", "Trial whenever convenient, years later", "Juries picked by the accuser", "Charges kept secret until verdict", "Trial by Congress for all crimes", "Colonial defendants shipped to England or admiralty courts, waiting years in irons for a hearing", "Royal governors dissolving assemblies that protested, then trying critics without juries", "A jury of twelve property owners only", "Trial in the capital regardless of crime"], "example": "Fast, open, juried, and informed — each answers a royal abuse.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-12", "week": "t2l6", "word": "What help does the Sixth Amendment give the accused at trial?", "definition": "Confront adverse witnesses and have counsel for defense", "wrong": ["A lawyer paid by the accuser", "Witnesses testifying in secret", "No defense allowed at all", "The judge testifies instead", "Appeals before the verdict", "Anonymous accusers whose written statements alone convict, with no lawyer for the poor", "Crown prosecutors using paid informers the defendant could never face in open court", "A second trial if acquitted", "Pardons before any charge"], "example": "Face your accusers and bring a lawyer — fairness made visible.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-13", "week": "t2l6", "word": "What does the Seventh Amendment preserve?", "definition": "Jury trial in federal civil suits over twenty dollars", "wrong": ["Jury trial in criminal cases", "Judges deciding all lawsuits", "Appeals to the king in London", "No juries after 1791", "Fines over twenty dollars banned", "Colonial merchants denied juries in vice-admiralty courts judging smuggling disputes", "Parliament's acts letting royal judges decide merchants' cases alone, shutting juries out", "Juries only for land disputes", "Twenty-dollar coins for jurors"], "example": "Twenty dollars then was serious money; civil cases keep juries too.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-14", "week": "t2l6", "word": "How do the Sixth and Seventh Amendments divide jury rights?", "definition": "Sixth guards juries in criminal trials; Seventh extends them to civil suits", "wrong": ["Sixth civil, Seventh criminal", "Both cover only the Supreme Court", "Sixth ends juries, Seventh restores", "Neither mentions juries at all", "Both apply only in wartime", "Reversing them gives criminals civil juries for theft and merchants criminal juries for contracts", "Reading the two together as banning every jury, leaving all verdicts to appointed judges", "Seventh repeals the Sixth", "Sixth for states, Seventh federal"], "example": "Criminal accusation gets a jury (Sixth); money disputes keep one too (Seventh).", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-15", "week": "t2l6", "word": "What does the Eighth Amendment say about bail and fines?", "definition": "No excessive bail set, nor excessive fines imposed", "wrong": ["Bail denied to everyone", "Fines paid to the king", "Bail set in gold only", "Fines funding the courts", "Bail for the rich alone", "Stuart judges setting impossible bail to jail enemies of the Crown without trial", "Royal courts fining critics into ruin for seditious libel against the king", "Free bail for all crimes", "Fines decided by the jury"], "example": "Bail and fines must fit — no pricing the poor out of freedom.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-16", "week": "t2l6", "word": "What punishments does the Eighth Amendment bar?", "definition": "Cruel and unusual punishments inflicted by the state", "wrong": ["Long trials and slow appeals", "Prison food and uniforms", "Hard labor for convicts", "Fines for felonies", "The death penalty always", "Drawing and quartering, burning, pressing, and other Tudor-Stuart terrors from history", "Punishments grossly out of proportion to the offense, shocking the community's conscience", "Jailing debtors forever", "Whipping sailors at sea"], "example": "Barbarity is out; what counts as cruel has been argued ever since.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-17", "week": "t2l6", "word": "What does the Ninth Amendment say about unlisted rights?", "definition": "The people keep unlisted rights; enumeration denies none", "wrong": ["Only listed rights exist", "States hold all unlisted rights", "Congress grants extra rights", "The list is closed forever", "Foreigners have no rights", "Anti-Federalist fears that naming some freedoms implies the others were surrendered", "Madison's answer to the impossible-to-list objection: silence never erases a right", "Courts may invent new rights", "Unlisted rights expire in time"], "example": "The safety net: absence from the list is not absence of the right.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-18", "week": "t2l6", "word": "Why did the Ninth Amendment seem necessary?", "definition": "Listing some rights might imply the rest were given up", "wrong": ["Lists are too long to read", "Ink was expensive in 1791", "Madison opposed all rights", "States demanded shorter lists", "Courts disliked long texts", "Federalists warning that no catalogue of natural rights could ever be complete", "The same impossibility argument used against any bill of rights at ratification", "Paper shortages in Congress", "Voters disliked amendments"], "example": "It answers the Federalist objection in the Federalists' own terms.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-19", "week": "t2l6", "word": "What does the Tenth Amendment reserve?", "definition": "Undelegated, unprohibited powers, reserved to states or people", "wrong": ["All powers to Congress", "All powers to the President", "All powers to the courts", "All powers to the army", "No powers anywhere", "The federalism bargain: enumerated national powers, everything else staying closer to home", "Anti-Federalist comfort that only listed powers were granted, echoed in dual sovereignty", "Power to coin money for states", "Power to declare war for states"], "example": "The federalism amendment: what is not given away or forbidden stays home.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-20", "week": "t2l6", "word": "When does the Tenth Amendment reserve a power?", "definition": "Only when neither delegated to the nation nor barred to states", "wrong": ["Always, for every power", "Never, under any reading", "Only in wartime", "Only with Congress's leave", "Only for large states", "Even powers explicitly granted Congress, like coining money and declaring war", "Even powers denied the states, like making treaties or coining their own money", "Only on leap years", "Only for new states"], "example": "Two locks must both be open: not delegated AND not prohibited.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-21", "week": "t2l6", "word": "What did the Thirteenth Amendment end?", "definition": "Slavery and involuntary servitude across the nation (1865)", "wrong": ["The draft forever", "Taxation of incomes", "Prohibition of alcohol", "The electoral college", "Child labor nationwide", "A system the Three-Fifths Compromise once counted and protected, abolished after civil war", "The fugitive-slave bargains of 1787 requiring free states to return escapees to bondage", "Segregated schools at once", "Poll taxes at once"], "example": "1865: the Constitution finally caught up with the Declaration.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-22", "week": "t2l6", "word": "What exception does the Thirteenth Amendment keep?", "definition": "Involuntary servitude as punishment for a duly convicted crime", "wrong": ["Slavery for debts owed", "Servitude for immigrants", "Labor for the poor", "Service in the army", "Work on Sundays", "Chain gangs and prison farms leasing convict labor to private companies for profit", "The loophole later generations debated as convict leasing spread across the South", "Apprenticeships for minors", "Chores for children"], "example": "Abolition with one carve-out: criminal punishment.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-23", "week": "t2l6", "word": "Whom does the Fourteenth Amendment make citizens?", "definition": "All born or naturalized in the United States (1868)", "wrong": ["Only property owners", "Only white men", "Only native-born", "Only voters", "Only soldiers", "Overruling Dred Scott, which held Black Americans could never be citizens of the nation", "Former Confederates automatically restored without any oath or condition", "Only officeholders", "Only taxpayers"], "example": "Birth or oath on American soil equals citizen. Dred Scott reversed.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-24", "week": "t2l6", "word": "What must states give under the Fourteenth Amendment?", "definition": "Due process of law and equal protection to every person", "wrong": ["Free land to settlers", "Guns to all citizens", "Gold-backed money", "A balanced budget", "Two senators per state", "The clauses later generations used against segregation, from schoolhouse doors to marriage", "Applying Bill of Rights limits against state governments, not just Congress in Washington", "Lower taxes for farmers", "Longer presidential terms"], "example": "Liberty's second lock: states, not just Congress, must play fair.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-25", "week": "t2l6", "word": "What did the Fifteenth Amendment secure?", "definition": "Votes not denied for race, color, or previous servitude (1870)", "wrong": ["Votes for all women", "Votes at eighteen", "Direct election of senators", "Abolition of slavery", "Prohibition of alcohol", "Enforcement acts sending federal marshals and troops to guard Black voters at Southern polls", "Poll taxes, literacy tests, and grandfather clauses Southern states used to dodge it for decades", "Votes for immigrants", "Two terms for presidents"], "example": "1870: race off the ballot box — on paper; enforcement took a century.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-26", "week": "t2l6", "word": "What did the Fifteenth Amendment leave undone?", "definition": "Sex and other barriers stood — the fight moved to the Nineteenth", "wrong": ["It ended all voting limits", "It enfranchised women too", "It lowered the voting age", "It banned poll taxes", "It ended segregation", "Literacy tests and white primaries that kept Black citizens from polls despite its promise", "The Court narrowing federal power to stop private violence and fraud at the ballot box", "It elected Black senators", "It freed the enslaved"], "example": "Race addressed, sex untouched — half the promise kept.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-27", "week": "t2l6", "word": "What did the Nineteenth Amendment establish?", "definition": "Votes not denied on account of sex; women's suffrage (1920)", "wrong": ["Only men may hold office", "Voting age at twenty-one", "Two votes per household", "Poll taxes for women", "Literacy tests for all", "Seventy-two years after Seneca Falls, White House pickets saw victory ratified", "Tennessee's one-vote margin completing ratification in August heat, amid red and yellow roses", "Men banned from voting", "Voting limited to mothers"], "example": "1920: the ballot box doubled.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L6-28", "week": "t2l6", "word": "How do the Fifteenth and Nineteenth Amendments relate?", "definition": "Fifteenth (1870) barred race tests; Nineteenth (1920) barred sex tests", "wrong": ["Both deal with slavery", "Both set the voting age", "Both elect the President", "Both ban poll taxes", "Both were ratified in 1870", "The Nineteenth repealing the Fifteenth after fifty years of failed enforcement", "Together they made voting compulsory for every adult citizen in every election", "Both passed in the same year", "Both concern Prohibition"], "example": "1870 answered race; 1920 answered sex — two chapters, fifty years apart.", "lesson": "Extra Topic: The Bill of Rights and Amendments"}, {"id": "L7-01", "week": "t2l7", "word": "What did the Eleventh Amendment (1795) take away from federal courts?", "definition": "Cases where outsiders sue a state: citizens of other states or foreign lands", "wrong": ["All criminal trials", "Supreme Court appeals", "Admiralty cases at sea", "Power to hear suits between two states", "Cases where a state sues outsiders first", "Suits by a state's own citizens in state courts", "Federal prosecution of counterfeiters and pirates on the high seas and navigable rivers", "Suits between citizens of different states where no state itself is ever named a defendant", "The Supreme Court's power of judicial review over acts of Congress"], "example": "Chisholm v. Georgia (1793) let outsiders sue states; the Eleventh reversed it.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-02", "week": "t2l7", "word": "Which Supreme Court decision triggered the Eleventh Amendment?", "definition": "Chisholm v. Georgia (1793), letting a creditor sue Georgia over war debts", "wrong": ["Marbury v. Madison", "Dred Scott's case", "McCulloch v. Maryland", "Gibbons v. Ogden, on steamboats", "The 1800 Jefferson-Burr tie", "A Georgia tax on the federal bank", "Pollock striking down the 1894 income tax as unapportioned and void for want of apportionment", "The Court ordering Virginia to free enslaved oystermen in 1793", "South Carolina's 1794 suit to seize federal customs houses at Charleston harbor"], "example": "Alexander Chisholm sued Georgia for unpaid Revolutionary debts — and won.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-03", "week": "t2l7", "word": "What principle does the Eleventh Amendment express?", "definition": "Sovereign immunity: states generally cannot be sued without consent", "wrong": ["Double jeopardy", "Judicial review", "Popular sovereignty", "Federal courts decide every dispute", "States may coin their own money", "Any citizen may sue any state at will", "The President controls all federal court dockets and calendars", "Congress can abolish state courts and move every case to federal judges in Washington at will", "Foreign ambassadors answer only to state governors and legislatures, never to federal courts"], "example": "The people of a state, as sovereign, decide when their state answers in court.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-04", "week": "t2l7", "word": "What did the Twelfth Amendment (1804) change about presidential elections?", "definition": "Electors cast separate ballots for President and Vice President", "wrong": ["Abolished the electoral college", "Let Congress pick the President", "Gave the vote to all women", "Set the voting age at eighteen", "Presidents serve one six-year term", "Electors meet in Washington to debate each December", "State legislatures lost all power to choose any electors forevermore", "The runner-up still becomes Vice President, as in 1796 and 1800", "The House decides every election by majority vote of all its members"], "example": "No more runner-up VPs: one ballot names the chief, a second names the deputy.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-05", "week": "t2l7", "word": "Which election fiasco forced the Twelfth Amendment?", "definition": "The 1800 Jefferson-Burr tie, thrown to the House for 36 ballots", "wrong": ["The 1796 Adams victory", "The 1824 corrupt bargain", "The 1876 Hayes-Tilden dispute", "The 2000 Florida recount", "Burr killing Hamilton in a duel", "Washington's unanimous elections", "The House picking Adams though Jackson won the popular vote in 1824", "South Carolina electors splitting tickets between Adams and Pinckney", "Federalist electors refusing to certify Jefferson's victory for a full year"], "example": "Jefferson tied his own running mate at 73; the House took six days to break it.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-06", "week": "t2l7", "word": "Under the Twelfth Amendment, who picks the President if no one wins an electoral majority?", "definition": "The House, voting by state with one vote per state delegation", "wrong": ["The Senate", "The Supreme Court", "State governors", "A national popular runoff", "The sitting President", "The Vice President-elect, automatically", "The Senate choosing between the top two nominees sent up by the House", "Each Representative casting one individual vote until someone wins a majority", "A joint session of Congress voting together as one single combined body"], "example": "House chooses the President by states; the Senate separately picks the deputy.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-07", "week": "t2l7", "word": "What power did Section 2 of the Thirteenth Amendment give Congress?", "definition": "Power to enforce abolition with appropriate laws, like the 1866 Civil Rights Act", "wrong": ["Power to tax incomes", "Power to draft soldiers", "Power to print money", "Power to declare war", "Power to admit new states", "Power to pardon Confederates freely", "Authority over presidential succession whenever both top offices fall vacant at once", "A free hand to rewrite Southern state constitutions without any ratification votes", "Power to set railroad rates and break the Standard Oil trust into pieces"], "example": "Abolition plus enforcement: Congress could punish slavery's return as a crime.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-08", "week": "t2l7", "word": "What labor system did the Thirteenth Amendment later reach beyond plantation slavery?", "definition": "Debt peonage, where workers were bound until debts were paid off", "wrong": ["Factory overtime", "Child chores", "Military drafts", "Sunday closing laws", "Apprenticeships for minors", "Chain gangs punishing convicted criminals", "Southern states leasing convicts to mines and railroads for profit for decades", "Company towns paying wages in scrip redeemable only at the company store", "Sharecropping contracts freely signed each planting season by both sides"], "example": "Courts read 'involuntary servitude' to cover peonage, not just chattel slavery.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-09", "week": "t2l7", "word": "How was the Thirteenth Amendment ratified?", "definition": "Congress passed it in January 1865; states completed ratification that December", "wrong": ["Lincoln decreed it alone", "The Supreme Court ordered it", "It was never ratified", "By the 1787 Convention", "By Union generals in the field", "By a proclamation needing no vote", "The Confederacy's surrender at Appomattox automatically wrote it into law", "Reconstructed legislatures all rejected it until Reconstruction finally ended in 1877", "A national referendum held alongside the 1864 presidential election decided it by landslide"], "example": "The Proclamation freed slaves as war policy; the amendment made it permanent law.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-10", "week": "t2l7", "word": "Whom does Section 3 of the Fourteenth Amendment bar from office?", "definition": "Oath-breakers who engaged in insurrection after swearing to the Constitution", "wrong": ["All Southerners", "All Democrats", "Foreign-born citizens", "Anyone under thirty-five", "Former enslavers", "Only Jefferson Davis, by name, forever", "Confederate soldiers who never held office or swore any oath before the war at any time", "Every white Southerner until Congress certified each state's loyalty in 1877 and beyond", "Veterans of foreign wars who criticize the government in print or speech"], "example": "Disloyalty had a price: oath-takers who rebelled needed Congress's pardon to serve.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-11", "week": "t2l7", "word": "What did Section 2 of the Fourteenth Amendment do about representation?", "definition": "Cut House seats for states that denied adult male citizens the vote", "wrong": ["Gave women the vote", "Ended the House", "Set senators at two", "Freed the enslaved", "Banned poll taxes", "Gave D.C. electors", "Granted bonus House seats to states that enfranchised Black men ahead of others", "Required every state to elect governors by direct popular vote each year", "Fixed the House at 435 seats apportioned by population every single decade"], "example": "Counted all persons whole, then dared states to disenfranchise — at the cost of seats.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-12", "week": "t2l7", "word": "What did Section 4 of the Fourteenth Amendment settle about debts?", "definition": "Union war debts stand valid; Confederate debts can never be paid", "wrong": ["All debts forgiven", "States may print money", "Poll taxes allowed", "Slavery compensated", "War bonds voided", "Rebels paid in full", "Former enslavers receive payment for each person freed by the amendment", "Northern banks must forgive every loan made to Southern planters before 1861", "The United States assumes every debt each rebel state contracted during the war"], "example": "Winners' debts honored, rebels' debts void, and no pay for emancipated slaves.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-13", "week": "t2l7", "word": "Who gained the vote in practice from the Fifteenth Amendment?", "definition": "Black men in the South, voting and holding office during Reconstruction", "wrong": ["White women", "Black women", "Teenagers", "Immigrants", "Native tribes", "Ex-Confederates", "Susan Anthony and Elizabeth Stanton casting fully legal ballots in 1872", "Southern white Unionists restored to every office without oath or condition", "Chinese laborers naturalized and voting in California mining camps by 1871"], "example": "1870 enfranchised Black men; Black women waited with all women until 1920.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-14", "week": "t2l7", "word": "How did Southern states dodge the Fifteenth Amendment after Reconstruction?", "definition": "Poll taxes, literacy tests, and white-only primaries that avoided naming race", "wrong": ["Open race bans", "Ending all elections", "Seceding again", "Banning the House", "Burning ballots yearly", "Restoring slavery", "Federal marshals guarding every Southern polling place continuously until 1965 without exception", "The Supreme Court striking down each literacy test within a single year of its passage", "Congress repealing the amendment outright in the Compromise of 1877"], "example": "Race-neutral on paper, surgical in practice — until the Voting Rights Act of 1965.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-15", "week": "t2l7", "word": "What enforcement tool did the Fifteenth Amendment give Congress?", "definition": "Section 2 power to pass laws guarding the vote, used in 1870 and 1965", "wrong": ["Command of armies", "Veto over governors", "Control of ballots", "Census authority", "Pardon power", "Rule over state courts", "Authority to appoint every Southern election official directly from Washington", "Automatic federal takeover of any state where turnout fell below one half", "A standing federal election police patrolling Southern counties ever since"], "example": "The promise needed muscle: Enforcement Acts then, Voting Rights Act a century later.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-16", "week": "t2l7", "word": "What did the Sixteenth Amendment (1913) let Congress do?", "definition": "Tax incomes from any source without apportioning among the states", "wrong": ["Ban liquor sales", "Coin silver coins", "End property taxes", "Abolish tariffs", "Print paper money", "End all excises", "Lay direct taxes only i
