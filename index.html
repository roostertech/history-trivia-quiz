<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Trivia Quiz</title>
<style>
  :root{
    --bg:#1e2836; --card:#ffffff; --ink:#22303f; --muted:#5b6b7c;
    --accent:#e4572e; --accent-dark:#c7431f; --teal:#0f9b8e; --amber:#f6ae2d;
    --wrong:#d64545; --line:#e3e8ee;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Trebuchet MS",Verdana,system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  header.topbar{
    width:min(760px,94vw); display:flex; align-items:center; gap:12px;
    padding:18px 4px 10px; color:#fff;
  }
  header.topbar h1{font-size:26px; margin:0; letter-spacing:.5px}
  header.topbar h1 .dot{color:var(--amber)}
  .stats{margin-left:auto; display:flex; gap:8px}
  .stat{background:#2b3a4f; border-radius:10px; padding:6px 12px; text-align:center; min-width:74px}
  .stat b{display:block; font-size:18px}
  .stat span{font-size:11px; color:#aeb9c6}
  .controls{width:min(760px,94vw); display:flex; gap:10px; padding:4px 4px 12px}
  select#weekFilter, select#countSelect, button#restartBtn, button#soundBtn, button#musicBtn{
    font:inherit; border-radius:12px; border:2px solid #31435a; padding:8px 12px;
    background:#2b3a4f; color:#fff;
  }
  button#restartBtn, button#soundBtn, button#musicBtn{cursor:pointer; border-radius:999px}
  button#restartBtn:hover, button#soundBtn:hover, button#musicBtn:hover{background:#3a4f6a}
  main.card{
    width:min(760px,94vw); background:var(--card); border-radius:18px; position:relative;
    padding:26px 26px 22px; box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .buddy{position:absolute; right:14px; top:12px; width:86px; height:auto; pointer-events:none}
  #buddyGrin,#buddyFrown,#buddyMad{display:none}
  .buddy[data-mood="happy"] #buddySmile{display:none}
  .buddy[data-mood="happy"] #buddyGrin{display:block}
  .buddy[data-mood="sad"] #buddySmile,.buddy[data-mood="angry"] #buddySmile{display:none}
  .buddy[data-mood="sad"] #buddyFrown,.buddy[data-mood="angry"] #buddyFrown{display:block}
  .buddy[data-mood="angry"] #buddyMad{display:block}
  #buddyPupils{transition:transform .07s linear}
  .buddy.hop{animation:buddy-hop .45s ease}
  @keyframes buddy-hop{0%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.05)}100%{transform:translateY(0)}}
  .blab{display:none; position:absolute; right:108px; top:22px; width:200px; background:#fffbe8;
    border:2px solid #4a3200; border-radius:12px; padding:8px 12px; font-size:13px; z-index:5}
  .blab small{color:var(--muted)}
  .blab.show{display:block; animation:blab-pop .3s ease}
  @keyframes blab-pop{0%{opacity:0; transform:scale(.7) translateY(6px)}100%{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){
    .buddy.hop, #furyStat.max b{animation:none}
  }
  /* ---- fury meter: consecutive misses, resets on correct ---- */
  #furyStat.low b{color:var(--amber)}
  #furyStat.med b{color:#e8852e}
  #furyStat.high b{color:#e4572e}
  #furyStat.max b{color:#ff3b30; animation:fury-blaze .5s ease infinite}
  @keyframes fury-blaze{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .pills{display:flex; gap:8px; margin-bottom:6px}
  .pill{font-size:12px; font-weight:bold; border-radius:999px; padding:4px 12px; background:#eef2f6; color:var(--muted)}
  .pill.week{background:var(--amber); color:#4a3200}
  .word{font-size:24px; line-height:1.35; margin:8px 0 2px; letter-spacing:.2px; padding-right:100px}
  .prompt{padding-right:100px}
  .prompt{color:var(--muted); margin:0 0 16px}
  .progress{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px}
  .progress i{display:block; height:100%; background:var(--teal); width:0%}
  .options{display:grid; gap:10px}
  .opt{
    display:flex; gap:12px; align-items:flex-start; text-align:left; cursor:pointer;
    font:inherit; font-size:16px; background:#f6f8fa; color:var(--ink);
    border:3px solid transparent; border-radius:12px; padding:12px 14px;
  }
  .opt:hover{border-color:var(--amber); background:#fff8e8}
  .opt .letter{
    flex:none; width:28px; height:28px; border-radius:8px; background:var(--ink);
    color:#fff; font-weight:bold; display:flex; align-items:center; justify-content:center;
  }
  .opt.correct{border-color:var(--teal); background:#e2f5f1}
  .opt.picked-wrong{border-color:var(--wrong); background:#fbe4e4}
  .opt:disabled{cursor:default}
  .options.answered{opacity:.5}
  .options.answered .opt{pointer-events:none; filter:grayscale(.4)}
  footer.hint{color:#8fa0b3; font-size:13px; padding:14px 0 26px; width:min(760px,94vw)}
  /* ---- feedback overlay ---- */
  .overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:20}
  .overlay.show{display:flex}
  .overlay.happy{background:rgba(246,174,45,.28)}
  .overlay.sad{background:rgba(178,44,44,.40)}
  .panel{
    position:relative; width:min(480px,92vw); background:#fff; text-align:center;
    border-radius:22px 22px 26px 26px; padding:30px 26px 24px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.4);
  }
  .overlay.sad .panel{border-top:10px solid #5b84ad; animation:sad-shake .5s ease}
  .overlay.happy .panel{border-top:10px solid var(--amber)}
  .face{font-size:64px; line-height:1; margin:0 0 6px; font-weight:bold}
  .overlay.happy .face{color:var(--accent); opacity:0}
  .overlay.happy.go .face{animation:happy-pop .55s cubic-bezier(.2,1.6,.4,1) forwards}
  .overlay.sad .face{color:#3d5a80}
  .verdict{font-size:30px; margin:4px 0}
  .detail{color:var(--muted); font-size:15px; margin:6px 0 4px}
  .detail b{color:var(--ink)}
  .trapnote{display:inline-block; margin-top:8px; font-size:13px; font-weight:bold;
    background:#4a3200; color:var(--amber); border-radius:999px; padding:4px 12px}
  #nextBtn{
    margin-top:16px; font:inherit; font-size:17px; font-weight:bold; cursor:pointer;
    background:var(--accent); color:#fff; border:0; border-radius:14px; padding:12px 34px;
  }
  #nextBtn:hover{background:var(--accent-dark)}
  .sparkle{position:absolute; font-size:22px; color:var(--amber); opacity:0; pointer-events:none}
  .overlay.happy.go .sparkle{animation:sparkle-pop .9s ease-out forwards}
  .confetti{position:absolute; top:-14px; width:10px; height:16px; border-radius:3px; opacity:0; pointer-events:none}
  .overlay.happy.go .confetti{animation:confetti-fall 1.4s ease-in forwards}
  .tear{position:absolute; top:86px; width:12px; height:18px; border-radius:0 50% 50% 50%;
    background:#5b9bd5; transform:rotate(45deg); opacity:0; pointer-events:none}
  .overlay.sad.go .tear{animation:tear-fall 1.1s ease-in forwards}
  .rain{position:absolute; top:-10px; width:3px; height:22px; background:#9fc3e5; opacity:0}
  .overlay.sad.go .rain{animation:confetti-fall 1.2s linear forwards}
  @keyframes happy-pop{0%{opacity:0; transform:scale(.2) rotate(-10deg)}70%{opacity:1; transform:scale(1.25) rotate(4deg)}100%{opacity:1; transform:scale(1)}}
  @keyframes sparkle-pop{0%{opacity:0; transform:scale(.3)}40%{opacity:1}100%{opacity:0; transform:scale(1.4) translateY(-26px)}}
  @keyframes confetti-fall{0%{opacity:1; transform:translateY(0) rotate(0)}100%{opacity:0; transform:translateY(340px) rotate(540deg)}}
  @keyframes sad-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  @keyframes tear-fall{0%{opacity:0; transform:rotate(45deg) translateY(0)}25%{opacity:1}100%{opacity:0; transform:rotate(45deg) translateY(120px)}}
  /* ---- anime characters ---- */
  .char-wrap{display:flex; gap:14px; align-items:center; text-align:left; margin-bottom:8px}
  .char{width:148px; height:auto; flex:none}
  .bubble{position:relative; background:#fff3d6; border:3px solid #4a3200; border-radius:14px;
    padding:10px 14px; font-weight:bold; font-size:22px; color:var(--ink)}
  .bubble small{display:block; font-weight:normal; font-size:14px; color:var(--muted); margin-top:4px}
  .bubble:before{content:""; position:absolute; left:-13px; top:36px; border-width:8px 12px 8px 0;
    border-style:solid; border-color:transparent #4a3200 transparent transparent}
  .overlay.sad .bubble{background:#e8f1f8; border-color:#3d5a80}
  .overlay.sad .bubble:before{border-color:transparent #3d5a80 transparent transparent}
  .overlay.happy.go .char-happy{animation:char-bounce .8s ease infinite}
  .overlay.sad.go .char-sad{animation:char-sway 1.4s ease-in-out infinite}
  .tdrop{opacity:0}
  .overlay.sad.go .tdrop{animation:tdrop-fall 1.2s ease-in infinite}
  @keyframes char-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  /* ---- streak tiers: hotter streak, cooler celebration ---- */
  .overlay.happy.go.tier-2 .panel{box-shadow:0 18px 50px rgba(0,0,0,.4), 0 0 45px rgba(246,174,45,.65)}
  .overlay.happy.go.tier-3 .panel{box-shadow:0 18px 50px rgba(0,0,0,.4), 0 0 80px rgba(228,87,46,.8);
    animation:panel-hype 1s ease-in-out infinite}
  .overlay.happy.go.tier-2 .char-happy{animation:char-bounce2 .6s ease infinite}
  .overlay.happy.go.tier-3 .char-happy{animation:char-flip 1s ease-in-out infinite}
  .streak-banner{font-weight:bold; font-size:20px; color:#fff; background:#c7431f; border-radius:10px;
    padding:6px 14px; margin-bottom:10px; letter-spacing:2px; animation:banner-drop .45s cubic-bezier(.2,2,.4,1)}
  .aura{position:absolute; left:-12px; top:-24px; width:184px; height:184px; border-radius:50%;
    background:radial-gradient(circle, rgba(246,174,45,.55), rgba(246,174,45,0) 70%);
    animation:aura-pulse .8s ease-in-out infinite; pointer-events:none}
  @keyframes char-bounce2{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-24px) rotate(4deg)}}
  @keyframes char-flip{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
  @keyframes panel-hype{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  @keyframes banner-drop{0%{opacity:0; transform:translateY(-30px) scale(1.3)}100%{opacity:1; transform:none}}
  @keyframes aura-pulse{0%,100%{transform:scale(.9); opacity:.7}50%{transform:scale(1.15); opacity:1}}
  /* ---- tier 4: 20+ mog form ---- */
  .overlay.happy.go.tier-4 .panel{box-shadow:0 18px 50px rgba(0,0,0,.45), 0 0 100px rgba(246,196,69,.9);
    animation:panel-hype .8s ease-in-out infinite}
  .overlay.happy.go.tier-4 .char-mog{animation:mog-strut .8s ease-in-out infinite}
  .overlay.happy.tier-4{animation:mog-pulse 1s ease infinite}
  .tier-4 .confetti{animation-duration:.8s}
  .tier-4 .aura{background:radial-gradient(circle, rgba(246,196,69,.7), rgba(246,196,69,0) 70%);
    width:220px; height:220px; left:-32px; top:-42px}
  .streak-banner.b4{background:#14141c; color:#f6c445; border:2px solid #f6c445}
  @keyframes mog-strut{0%,100%{transform:translateX(-14px) rotate(-6deg)}50%{transform:translateX(14px) rotate(6deg)}}
  @keyframes mog-pulse{0%,100%{background:rgba(246,174,45,.3)}50%{background:rgba(20,20,28,.55)}}
  /* ---- relief: breaking the fury streak ---- */
  .overlay.happy.go .char-relief{animation:relief-slump 1.6s ease forwards}
  .overlay.go .sweat{animation:tdrop-fall 1.4s ease-in infinite}
  @keyframes relief-slump{0%{transform:translateY(-10px)}60%{transform:translateY(6px)}100%{transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){
    .overlay .aura, .overlay .streak-banner, .overlay.happy.go .panel,
    .overlay.happy.tier-4, .overlay .char-angry, .overlay .puff, .overlay .sweat{animation:none}
  }
  /* ---- learning: answer reveal + miss review ---- */
  .answer-reveal{margin:10px 0 4px; background:#e2f5f1; border:3px solid var(--teal);
    border-radius:12px; padding:10px 14px}
  .answer-reveal span{display:block; font-size:12px; font-weight:bold; letter-spacing:1px; color:#0b6e65}
  .answer-reveal b{display:block; font-size:19px; margin:2px 0}
  .answer-reveal i{display:block; font-size:13px; color:var(--muted); margin-top:4px}
  .miss-list{margin:12px 0 4px; background:#f6f8fa; border:2px solid var(--line); border-radius:12px;
    padding:10px 14px; text-align:left; font-size:14px; max-height:160px; overflow:auto}
  .miss-list span{font-size:12px; font-weight:bold; letter-spacing:1px; color:var(--muted)}
  .miss-list div{margin-top:6px}
  #retryBtn{margin-top:12px; margin-right:8px; font:inherit; font-size:16px; font-weight:bold; cursor:pointer;
    background:#fff; color:#0b6e65; border:3px solid var(--teal); border-radius:14px; padding:10px 22px}
  #retryBtn:hover{background:#e2f5f1}
  @keyframes char-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes tdrop-fall{0%{opacity:0; transform:translateY(0)}25%{opacity:1}100%{opacity:0; transform:translateY(22px)}}
  .soot{position:absolute; bottom:-10px; width:7px; height:7px; background:#1a1a1a;
    border-radius:50%; opacity:0; pointer-events:none}
  .overlay.sad.go .soot{animation:soot-flicker 1.1s ease-out forwards}
  @keyframes soot-flicker{0%{opacity:0; transform:translateY(0) scale(.6)}20%{opacity:1}40%{opacity:.3; transform:translateY(-40px) scale(1)}60%{opacity:.9; transform:translateY(-90px) scale(.8)}100%{opacity:0; transform:translateY(-160px) scale(1.1)}}
  .char-wrap{position:relative}
  .vortex{display:none; width:148px; height:150px; flex:none; position:relative}
  .char-wrap.vanished .vortex{display:block}
  .vortex:before,.vortex:after{content:""; position:absolute; border-radius:50%; border:7px solid transparent}
  .vortex:before{left:24px; top:15px; width:100px; height:100px;
    border-top-color:#e4572e; border-right-color:#e4572e; animation:vortex-spin .7s linear infinite}
  .vortex:after{left:42px; top:33px; width:64px; height:64px;
    border-bottom-color:#f6ae2d; border-left-color:#f6ae2d; animation:vortex-spin .5s linear infinite reverse}
  .overlay.sad.go .char-wrap.vanished .char-sad, .overlay.sad.go .char-wrap.vanished .char-angry{position:absolute; left:0; top:10px; width:148px;
    animation:trap-suck .8s ease-in forwards}
  .overlay.sad.go .char-angry{animation:angry-tremble .3s linear infinite}
  .overlay.sad.go .puff{animation:steam-rise 1s ease-out infinite}
  @keyframes angry-tremble{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}
  @keyframes steam-rise{0%{opacity:0; transform:translateY(8px)}30%{opacity:.9}100%{opacity:0; transform:translateY(-22px)}}
  .trap-stamp{position:absolute; right:14px; top:14px; z-index:5; font-weight:bold; font-size:26px;
    color:#c7431f; border:4px solid #c7431f; border-radius:8px; padding:4px 12px;
    background:rgba(255,255,255,.88); animation:stamp-slam .4s cubic-bezier(.2,2.5,.4,1) forwards}
  .overlay.sad.trap-flash{animation:trap-flash .9s ease}
  .overlay.sad.trap-flash .panel{animation:trap-rattle .5s ease}
  @keyframes trap-suck{0%{opacity:1; transform:scale(1) rotate(0)}30%{opacity:1; transform:scale(1.08) rotate(-8deg)}100%{opacity:0; transform:scale(0) rotate(720deg)}}
  @keyframes vortex-spin{to{transform:rotate(360deg)}}
  @keyframes stamp-slam{0%{opacity:0; transform:scale(3) rotate(10deg)}100%{opacity:1; transform:scale(1) rotate(-8deg)}}
  @keyframes trap-flash{0%,100%{background:rgba(178,44,44,.40)}25%,60%{background:rgba(210,50,45,.60)}45%{background:rgba(178,44,44,.40)}}
  @keyframes trap-rattle{0%,100%{transform:translate(0)}20%{transform:translate(-12px,4px) rotate(-1deg)}40%{transform:translate(10px,-5px) rotate(1deg)}60%{transform:translate(-8px,-3px)}80%{transform:translate(6px,3px)}}
  @media (prefers-reduced-motion: reduce){
    .overlay.sad .char-wrap.vanished .char-sad{position:static; width:148px; animation:none; opacity:0}
    .overlay .vortex{display:none}
    .overlay .trap-stamp, .overlay.sad.trap-flash, .overlay.sad.trap-flash .panel{animation:none}
  }
  @media (prefers-reduced-motion: reduce){
    .overlay.sad .panel, .overlay.happy.go .face, .overlay.happy.go .sparkle,
    .overlay.happy.go .confetti, .overlay.sad.go .tear, .overlay.sad.go .rain,
    .overlay .char, .overlay .tdrop, .overlay.sad.go .soot{animation:none; opacity:1}
  }
</style>
</head>
<body>
<header class="topbar">
  <h1>History Trivia Quiz<span class="dot">!</span></h1>
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>score</span></div>
    <div class="stat"><b id="streak">0</b><span>streak</span></div>
    <div class="stat"><b id="qnum">–</b><span>question</span></div>
    <div class="stat" id="furyStat"><b id="fury">0</b><span>fury</span></div>
  </div>
</header>
<div class="controls">
  <select id="weekFilter" aria-label="Choose question set">
    <option value="all">All lessons (120 questions)</option>
    <option value="t1l5">Topic 1 · Lesson 5: Winning Independence</option>
    <option value="t2l1">Topic 2 · Lesson 1: A Weak Confederation</option>
    <option value="t2l2">Topic 2 · Lesson 2: Drafting a Constitution</option>
    <option value="t2l3">Topic 2 · Lesson 3: Ideas That Influenced the Constitution</option>
    <option value="t2l4">Topic 2 · Lesson 4: Federalists, Antifederalists, and the Bill of Rights</option>
    <option value="t2l5">Topic 2 · Lesson 5: Understanding the Constitution</option>
  </select>
  <select id="countSelect" aria-label="How many questions per round">
    <option value="10">10 questions</option>
    <option value="20">20 questions</option>
    <option value="30">30 questions</option>
    <option value="50">50 questions</option>
    <option value="all" selected>All questions</option>
  </select>
  <button id="restartBtn" type="button">Restart</button>
  <button id="soundBtn" type="button">Sound: on</button>
  <button id="musicBtn" type="button">Music: on</button>
</div>
<main class="card">
  <div class="pills"><span class="pill week" id="weekPill">Lesson</span><span class="pill" id="typePill">question</span></div>
  <svg class="buddy" id="buddy" viewBox="0 0 120 112" role="img" aria-label="Study buddy watching your cursor">
    <rect x="40" y="88" width="40" height="20" rx="10" fill="#0f9b8e"/>
    <g id="buddyHead">
      <ellipse cx="60" cy="48" rx="44" ry="40" fill="#3a2f2f"/>
      <ellipse cx="60" cy="56" rx="34" ry="32" fill="#ffd9b3"/>
      <path d="M28,52 Q36,30 48,44 Q56,26 68,40 Q80,26 92,52 Q90,38 60,34 Q30,38 28,52 Z" fill="#3a2f2f"/>
      <ellipse cx="46" cy="58" rx="9" ry="11" fill="#ffffff"/>
      <ellipse cx="74" cy="58" rx="9" ry="11" fill="#ffffff"/>
      <g id="buddyPupils">
        <circle cx="46" cy="60" r="4.5" fill="#2b2b2b"/>
        <circle cx="74" cy="60" r="4.5" fill="#2b2b2b"/>
        <circle cx="47.5" cy="58.5" r="1.5" fill="#ffffff"/>
        <circle cx="75.5" cy="58.5" r="1.5" fill="#ffffff"/>
      </g>
      <path id="buddySmile" d="M50,80 Q60,88 70,80" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g id="buddyGrin">
        <path d="M46,78 Q60,78 74,78 Q72,93 60,94 Q48,93 46,78 Z" fill="#8e3b3b"/>
        <ellipse cx="60" cy="88" rx="6" ry="4" fill="#ff8f8f"/>
      </g>
      <path id="buddyFrown" d="M50,85 Q60,77 70,85" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g id="buddyMad">
        <path d="M35,42 L53,49" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
        <path d="M85,42 L67,49" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
        <path d="M90,24 L90,36 M84,30 L96,30" stroke="#c7431f" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <ellipse cx="38" cy="70" rx="5" ry="3" fill="#ff9d9d" opacity="0.8"/>
      <ellipse cx="82" cy="70" rx="5" ry="3" fill="#ff9d9d" opacity="0.8"/>
    </g>
  </svg>
  <div class="blab" id="blab"></div>
  <h2 class="word" id="word">…</h2>
  <p class="prompt" id="prompt">Choose the correct answer:</p>
  <div class="progress"><i id="bar"></i></div>
  <div class="options" id="options"></div>
</main>
<footer class="hint" id="hint">4 answers: the correct one plus 3 look-alikes drawn from similar events. Read carefully.</footer>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script>
/* __BANK_START__ */
const WORDS = [{"id": "L5-01", "week": "t1l5", "word": "Which Spanish governor secretly supplied the Americans early in the war, then after Spain entered it in 1779 seized British forts along the Mississippi and Gulf and drove the British from West Florida?", "definition": "Bernardo de Gálvez, Spanish governor secretly arming Americans, then seizing Gulf forts of 1779", "wrong": ["The Marquis de Lafayette, young French noble who fought at Brandywine and persuaded France to send thousands of trained soldiers", "Friedrich von Steuben, Prussian veteran who spent the Valley Forge winter drilling Washington's troops to march and fight", "Casimir Pulaski, Polish volunteer who trained American cavalry and fell mortally wounded at Savannah", "Thaddeus Kosciuszko, Polish engineer who built Patriot forts and defenses like West Point", "Captain John Paul Jones, naval officer who captured the Serapis aboard Bonhomme Richard in 1779", "General Nathanael Greene, commander in the South who engaged only on ground that disadvantaged Cornwallis", "General Daniel Morgan, victor of Cowpens with his two-volley staged retreat in January 1781", "Francis Marion, the Swamp Fox who ran guerrilla hit-and-run raids from Carolina swamps", "George Rogers Clark, frontiersman who bluffed Vincennes into surrender with Miami help in 1779"], "example": "Gálvez secretly sent medicine, cloth, muskets, and powder, then took British forts on the Mississippi/Gulf and West Florida; Galveston, Texas is named for him.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-02", "week": "t1l5", "word": "Which young French noble fought at Brandywine, became one of Washington's most trusted friends, and convinced France to send several thousand trained soldiers?", "definition": "The Marquis de Lafayette, Brandywine fighter who secured French soldiers", "wrong": ["Comte de Rochambeau, French commander marching overland with Washington to Yorktown", "Admiral de Grasse, French admiral sealing Chesapeake Bay against Cornwallis's escape", "Friedrich von Steuben, Prussian drilling Washington's army at Valley Forge", "Bernardo de Gálvez, Spanish governor seizing British forts on the Gulf Coast", "Casimir Pulaski, Pole training cavalry before dying of wounds at Savannah", "Thaddeus Kosciuszko, Polish engineer designing forts and defenses at West Point", "Benedict Arnold, Patriot general turned traitor, burning Richmond in 1780", "Thomas Jefferson, Virginia's governor during Arnold's raid on Richmond", "John Paul Jones, captain whose Bonhomme Richard captured the Serapis"], "example": "Lafayette fought at Brandywine and secured thousands of French soldiers for the Patriot cause.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-03", "week": "t1l5", "word": "Which veteran of the Prussian army, considered the best in Europe, taught Washington's troops to march and drill?", "definition": "Friedrich von Steuben, Prussian veteran drilling Washington's troops to march at Valley Forge", "wrong": ["The Marquis de Lafayette, French noble who secured thousands of French soldiers for the Patriot cause", "Casimir Pulaski, Polish volunteer who trained American cavalry before falling mortally wounded at Savannah", "Thaddeus Kosciuszko, Polish engineer who built Patriot forts and defenses, including West Point", "General Nathanael Greene, southern commander who fought the British only on advantageous ground", "General Daniel Morgan, victor of Cowpens with a staged two-volley retreat in January 1781", "Bernardo de Gálvez, Spanish governor who seized British forts along the Gulf Coast", "Francis Marion, militia leader who ran hit-and-run guerrilla raids from the Carolina swamps", "Comte de Rochambeau, French commander who marched overland with Washington to Yorktown", "Benedict Arnold, Patriot general turned traitor who burned Richmond alongside the British"], "example": "Von Steuben, ex-Prussian army, drilled the Continentals in marching and drill.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-04", "week": "t1l5", "word": "At the Battle of Monmouth in 1778, what did Mary Ludwig Hays do to earn the nickname Molly Pitcher?", "definition": "She hauled water at Monmouth, then fired her wounded husband's cannon in the battle", "wrong": ["She sewed stars-and-stripes flags for Washington's army in her Philadelphia upholstery shop", "She repaired cannons and guns with blacksmith Samuel Leverett in the days after Concord", "She took charge of her husband's farm and business for the whole length of his service", "She wrote a celebrated poem addressed to General Washington that won her freedom", "She carried dispatches through British lines during the siege trenches at Yorktown", "She nursed the wounded alongside Martha Washington through the winter at Valley Forge", "She spied on Loyalist raiders across Pennsylvania and New York for the militia", "She negotiated the release of prisoners taken when the British fell back after Cowpens", "She printed the Continental currency that Congress used to pay Washington's troops"], "example": "Hays carried water at Monmouth (hence Molly Pitcher) and took her wounded husband's place on the cannon.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-05", "week": "t1l5", "word": "What distinction does Phillis Wheatley hold in American literary history?", "definition": "The first published African American female poet, writing to Washington in 1776", "wrong": ["She sewed the first stars-and-stripes flag for Washington's army in Philadelphia", "She carried water to soldiers at Monmouth and worked her husband's cannon", "She repaired Patriot cannons with Samuel Leverett in the days after Concord", "She led Iroquois raids alongside Loyalists through Pennsylvania and New York", "She commanded cavalry that Casimir Pulaski had trained for the southern campaign", "She negotiated the Treaty of Paris with Franklin, Adams, Jay, and Laurens in 1782", "She was born in Philadelphia to free parents and schooled in Latin and Greek", "She fought in the ranks with the Continentals through the siege at Yorktown", "She served as Washington's chief military engineer, building the Yorktown works"], "example": "Wheatley, enslaved in Boston at age 7, mastered English, Greek, and Latin and wrote 'To His Excellency General Washington'; freed after her London success.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-06", "week": "t1l5", "word": "In February 1779, how did George Rogers Clark's small force capture the British fort at Vincennes?", "definition": "They spread through woods to look numerous and, aided by Miami, took Vincennes", "wrong": ["They fired two volleys, retreated on purpose, and drew the British into crossfire like at Cowpens", "They struck suddenly from the swamps and vanished back, in Marion's guerrilla fashion", "A French fleet closed the nearby bay while allied armies laid siege by land at Yorktown", "They captured a British warship offshore and forced the fort to surrender like Jones", "Loyalist militia inside the fort opened the gates to them in a midnight betrayal", "They tunneled under the walls through a three-month siege in the European style", "Spanish troops from West Florida stormed the fort beside them under Gálvez", "They bribed the British commander with chests of Continental paper currency", "They blockaded the Ohio River until the starving garrison gave up the fort"], "example": "Clark first took Kaskaskia and Cahokia with Miami help, then bluffed Vincennes with a spread-out force; it surrendered February 1779.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-07", "week": "t1l5", "word": "What was Captain John Paul Jones's greatest victory, won in September 1779 on the North Sea in Britain's backyard?", "definition": "Capturing the British Serapis aboard Bonhomme Richard in 1779 on the North Sea", "wrong": ["Blockading American ports with a great navy to cut off all Patriot supply routes", "Seizing Savannah, Charleston, and Camden for the Crown in the southern campaign", "Driving the British out of West Florida with Spanish troops under Gálvez", "Taking British forts at Kaskaskia and Cahokia on the frontier with Clark", "Closing Chesapeake Bay with a French fleet to trap Cornwallis at Yorktown", "Burning Richmond alongside Benedict Arnold after his treason at West Point", "Drilling Washington's troops to march and handle muskets like von Steuben", "Leading French soldiers ashore beside Lafayette at the Battle of Brandywine", "Capturing British forts along the Mississippi River for the Spanish governor"], "example": "Jones captured the Serapis in September 1779; note the blockade of American ports was something the British navy did to the Americans.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-08", "week": "t1l5", "word": "What trick won the Battle of Cowpens for General Daniel Morgan in January 1781?", "definition": "The front line fired twice, retreated, and drew the British into crossfire", "wrong": ["His militia struck from the swamps and vanished back into them in guerrilla fashion", "His troops spread through the woods to look more numerous, bluffing like Clark", "A French fleet cut the British off by sea while he pressed a siege on land", "His cavalry charged a British warship offshore in the style of John Paul Jones", "His Loyalist allies opened the British camp gates to him in a night attack", "His artillery bombarded Charleston until the whole garrison surrendered", "His soldiers tunneled under Guilford Courthouse to blow up the British guns", "His Spanish allies marched up from West Florida to join the battle", "His troops burned Richmond to draw the British army out of its defenses"], "example": "Morgan's staged retreat at Cowpens (January 1781) pulled the British into the second line's fire.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-09", "week": "t1l5", "word": "What was the outcome of the fighting at Guilford Courthouse, one of the bloodiest battles of the war?", "definition": "Americans retreated, having inflicted huge British losses, turning the tide", "wrong": ["Cornwallis surrendered his entire army to Washington and Rochambeau on the field", "The British seized the town and held the Carolinas firmly for the rest of the war", "A French fleet arrived offshore and trapped the British against the sea", "Morgan's retreating front line destroyed the whole British column with crossfire", "Loyalist militia switched sides mid-battle and joined Greene's Continentals", "The battle never happened because Cornwallis marched straight to Virginia", "John Paul Jones bombarded the courthouse with naval guns from offshore", "Spanish troops from Florida arrived in time to decide the battle", "Both sides signed an armistice there that ended the whole southern campaign"], "example": "At Guilford Courthouse the Americans retreated yet inflicted losses so heavy the momentum shifted to the Patriots.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-10", "week": "t1l5", "word": "Under the Treaty of Paris, where did the southern border of the newly recognized United States stop?", "definition": "At Florida, returned to Spain, with America reaching the Mississippi and Lakes", "wrong": ["At the Mississippi River, which Spain kept entirely for its own Louisiana territory", "At the Great Lakes, which Britain kept as bases for fur trade, troops, and forts", "At the Atlantic Ocean, which France claimed for carrying American trade", "At New Orleans, which Spain ceded outright to the United States", "At the Appalachian Mountains, keeping all settlers east of the divide forever", "At the Ohio River, drawn to divide future free and slave territory", "At Charleston, which Britain kept as a permanent naval base in the south", "At Chesapeake Bay, where the last battle had trapped Cornwallis", "At Vincennes, marking the limit of George Rogers Clark's victories"], "example": "Treaty of Paris: US from Atlantic to Mississippi, north to the Great Lakes, south to Florida (returned to Spain); Congress ratified it April 15, 1783.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-11", "week": "t1l5", "word": "Known as the Swamp Fox, how did Francis Marion's small militia band harass the British in South Carolina?", "definition": "Guerrilla hit-and-run raids, striking from the swamps and vanishing back", "wrong": ["By firing two volleys, retreating on purpose, and luring the British into crossfire", "By spreading through the woods to appear more numerous than his whole band was", "By besieging with 16,000 troops while an allied fleet closed the bay", "By capturing the British warship Serapis in a North Sea naval duel", "By seizing Savannah, Charleston, and Camden for the Crown in the south", "By drilling his men to march in stiff Prussian formation like Steuben", "By building forts and defenses as a trained military engineer", "By training cavalry for thundering charges on horseback like Pulaski", "By blockading southern ports with a superior navy of his own"], "example": "Marion's band used the swamps for sudden guerrilla (hit-and-run) attacks.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-12", "week": "t1l5", "word": "How did General Nathanael Greene, taking command in the South in 1780, use local geography against Cornwallis?", "definition": "He fought the British only on ground that disadvantaged them, wearing them down", "wrong": ["Ordering his front line to fire exactly two volleys before staging a retreat at every single battle he ever fought", "He hid his militia in the swamps to spring surprise raids on patrols", "He spread his small force through woods to look larger, bluffing like Clark in 1780", "He trapped the British on a peninsula with a French fleet sealing the sea", "He blockaded southern ports with warships captured from the British", "He burned Richmond to deny the British army its supplies", "He built a chain of forts across the Carolina backcountry for defense", "He charged British lines with Polish-trained cavalry at full gallop", "He waited safely in New York while the French fought the south alone"], "example": "Greene (1780) fought only where local geography disadvantaged the British, wearing Cornwallis down.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-13", "week": "t1l5", "word": "What did Benedict Arnold do after turning traitor in September 1780 while commanding West Point?", "definition": "He joined the British, led their troops, and captured and burned Richmond", "wrong": ["He was caught by a Patriot patrol and hanged on Washington's orders at West Point", "He fled to Spanish Louisiana and served Governor Gálvez against the British", "He joined Lafayette's raids that chased Cornwallis across Virginia", "He surrendered West Point's garrison to the French fleet in the Hudson", "He led the militia victory at Cowpens in January 1781 for the Patriots", "He drilled Washington's troops to march and handle arms at Valley Forge", "He negotiated the Treaty of Paris alongside Franklin, Adams, and Jay", "He commanded the Serapis in its duel with John Paul Jones", "He retired to Philadelphia and quietly wrote his memoirs of the war"], "example": "Arnold plotted to hand over West Point (Sept 1780), escaped, then led British raids including burning Richmond; ordered hanged but never captured.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-14", "week": "t1l5", "word": "At Yorktown, what were the relative strengths when 16,000+ American and French troops laid siege, and when did the British surrender?", "definition": "Under 8,000 British faced 16,000+ allies; surrender on October 19, 1781", "wrong": ["Fewer than 8,000 British under Cornwallis, with surrender coming April 15, 1783", "Two equal armies of 12,000 men, with the surrender back in September 1779", "More British than allies on the field, surrendering in January 1781", "Fewer than 8,000 British, with the surrender at Vincennes in February 1779", "16,000 British against 8,000 allies, surrendering in December 1783", "Fewer than 8,000 British, with the surrender waiting until May 1787", "20,000 British in the trenches, surrendering after Guilford Courthouse", "Fewer than 8,000 British, with the surrender in September 1780", "Two equal armies, surrendering aboard the Serapis in the North Sea"], "example": "Siege: 16,000+ allies vs under 8,000 British; surrender October 19, 1781 (band played 'The World Turned Upside Down'; Cornwallis skipped the ceremony, claiming illness).", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-15", "week": "t1l5", "word": "At Yorktown, which French commander marched troops overland with Washington while which one closed the trap by sea?", "definition": "Rochambeau marched overland with Washington; de Grasse sealed Chesapeake Bay", "wrong": ["Admiral de Grasse marching overland while Rochambeau sailed the fleet into the bay", "Lafayette marching overland while John Paul Jones closed the trap by sea", "Von Steuben marching overland while Gálvez sailed up from the Gulf with ships", "Rochambeau marching overland while the British navy sealed the bay", "Benedict Arnold marching overland while Pulaski's cavalry arrived by transport", "Daniel Morgan marching overland while Kosciuszko rowed reinforcements by sea", "George Rogers Clark marching overland while Francis Marion paddled up by river", "Thomas Jefferson marching overland while the Spanish fleet closed the bay", "Nathanael Greene marching overland while de Grasse sailed away from the bay"], "example": "Washington + Rochambeau marched south to join Lafayette; de Grasse's fleet sealed Chesapeake Bay so Cornwallis could escape neither by land nor sea.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-16", "week": "t1l5", "word": "Who did Congress send to Paris in 1782 to negotiate the treaty ending the war?", "definition": "Franklin and Adams, joined by Jay of New York and Laurens of Carolina", "wrong": ["George Washington and Thomas Jefferson, with Lafayette advising the delegation", "John Paul Jones and Nathanael Greene, with Rochambeau advising on terms", "Benedict Arnold and Charles Cornwallis, with Clinton mediating the treaty", "Bernardo de Gálvez and Admiral de Grasse, with Spain mediating the peace", "Daniel Morgan and Francis Marion, with Greene advising on the frontier", "John Jay acting alone, with no fellow negotiators sent to assist him", "Henry Laurens and Benedict Arnold, with Franklin advising from Paris", "Thomas Jefferson and James Madison, with John Jay advising the pair", "Rochambeau and de Grasse, with Washington advising the French generals"], "example": "Talks began in Paris in 1782; Franklin, Adams, Jay (NY), and Laurens (SC) won most American demands since Britain was eager to end the war.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-17", "week": "t1l5", "word": "Why was April 15, 1783, when Congress ratified the Treaty of Paris, a symbolic date?", "definition": "It fell almost eight years to the day after the battles of Lexington and Concord", "wrong": ["It fell exactly ten full years after the Treaty of Paris peace talks had first begun between Franklin and the British", "It marked one full year since Cornwallis surrendered his entire army at Yorktown to Washington and Rochambeau", "It was the same day Washington bid farewell at Fraunces Tavern in New York", "It marked eight full years since the Declaration of Independence was signed", "It was the day the French fleet first entered Chesapeake Bay to trap Yorktown", "It marked one full year since Morgan's victory at the Battle of Cowpens", "It was the same day Arnold turned traitor at West Point on the Hudson", "It marked five full years since France had joined the war as an ally", "It was the day the last British troops finally sailed out of New York"], "example": "Ratification (April 15, 1783) fell almost eight years to the day after Lexington and Concord; Washington's Fraunces Tavern farewell came later, in December 1783.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-18", "week": "t1l5", "word": "What pattern marked the frontier war involving Joseph Brant, the Wyoming Valley, and Iroquois villages?", "definition": "Brant's raids and the Wyoming massacre, then Patriot ruin of Iroquois villages", "wrong": ["Miami warriors nobly helping Clark seize Vincennes peacefully without any bloodshed at all", "Iroquois nations uniting with the Patriots from the very start of the war", "British forts on the Mississippi falling to French regular troops in 1779", "Loyalists and Patriots signing a lasting frontier truce in the backcountry in 1778", "Spanish troops driving the British from West Florida frontier villages", "The Wyoming Valley voting peacefully to join the Confederation government", "Brant negotiating the Treaty of Paris terms for the frontier in 1782", "Frontier militia using Marion-style swamp guerrilla tactics in New York", "Washington personally leading the retaliation raids into Iroquois country"], "example": "Brant raided with Loyalists; Loyalists and allied Indians killed 360 settlers at Wyoming (1778); Patriots retaliated by destroying dozens of Iroquois villages.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-19", "week": "t1l5", "word": "Which woman is legend-credited with sewing the first American flag of stars and stripes for Washington's army?", "definition": "Betsy Ross of Philadelphia, legend's sewer of the first stars-and-stripes", "wrong": ["Mary Ludwig Hays, who carried water at Monmouth and worked her husband's cannon", "Betsy Hagar, who repaired cannons with Samuel Leverett in the days after Concord", "Martha Washington, who joined her husband at the front through harsh winters", "Phillis Wheatley, the enslaved Boston poet who wrote to General Washington", "A nurse who washed clothes and cooked for the troops at Valley Forge", "The wife of blacksmith Samuel Leverett, gun-repairer of Concord", "A Philadelphia printer who published the army's orders and proclamations", "The daughter of General Nathanael Greene, raised in camp with the army", "A camp follower who loaded cannon through the siege trenches at Yorktown"], "example": "Legend credits Philadelphia's Betsy Ross with the first stars-and-stripes flag — distinct from Molly Pitcher (Monmouth cannon) and Hagar (Concord gun repairs).", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L5-20", "week": "t1l5", "word": "Why did geography itself favor the American cause against Britain?", "definition": "Britain shipped men thousands of miles against a spread-out, knowing enemy", "wrong": ["Britain's nearby Canadian bases gave it short, safe, well-guarded supply lines", "The Atlantic crossing took only days, so British reinforcements arrived quickly", "American troops stood concentrated in one city that was easy to defend", "The British knew the southern swamps far better than Marion ever did", "France paid Britain to stretch its own supply routes across the ocean", "The war was fought entirely at sea, where British seamanship ruled", "Mountains kept every French army from ever reaching American shores", "Deserts between the colonies slowed American movement more than British", "Britain's navy sailed rivers the Americans themselves had never mapped"], "example": "Distance + dispersed enemy + American local knowledge beat British power; Spanish pressure on the Gulf/Mississippi and French money and troops compounded it.", "lesson": "Topic 1 · Lesson 5: Winning Independence"}, {"id": "L1-01", "week": "t2l1", "word": "Congress approved the Articles of Confederation in 1777, yet they took effect only in 1781. What caused the delay?", "definition": "Maryland held out for land cessions until Virginia, moved by Jefferson, ceded last", "wrong": ["Shays' 1786 uprising of debt-crushed Massachusetts farmers forcing Congress to rewrite the Articles", "The May 1787 convention having to approve the Articles beforehand", "Britain refusing to abandon its Great Lakes forts and fur posts until the year 1781 arrived", "Britain refusing to abandon its Great Lakes forts until 1781", "Spain shutting New Orleans until Congress paid its foreign debts", "Nine states voting the Articles down twice before passing them", "The Continental dollar collapsing and needing replacement first", "Vermont's quarrel with New York awaiting a court verdict", "France withholding loans until the war ended in 1783"], "example": "Maryland held out for western-land cessions; Virginia, persuaded by Jefferson, ceded last, so Maryland ratified in 1781.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-02", "week": "t2l1", "word": "Under the Articles of Confederation, how many states had to approve before a law passed by Congress could go into effect?", "definition": "Nine states had to approve a law passed by Congress before it could go into effect", "wrong": ["Sixty thousand free settlers petitioning Congress in writing before any new law could take effect", "Thirty-six surveyed township sections selling off before a newly passed law stood valid", "All thirteen states approving unanimously, as with amendments", "One delegate per state signing the law in person at Congress", "Six hundred forty dollars of property backing every law passed", "Five thousand free white males voting for the law beforehand", "Seven states, a bare majority, enacting any law proposed", "Two-thirds of the army's officers approving each law", "Every land-claim state consenting before a law passed"], "example": "Nine states had to approve a law — and even then, enforcement was left to the states.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-03", "week": "t2l1", "word": "How was each state represented in Congress under the Articles of Confederation?", "definition": "Each state sent one delegate and cast one vote, whatever its size or population", "wrong": ["Congressional votes apportioned by each state's people, wealth, and taxes paid in", "Each state sending two delegates wielding two full votes apiece on every question", "Representation in Congress based strictly on the taxes each state paid in", "Big landed states wielding extra votes for their claims", "Only the nine largest states voting at all in Congress", "Each state voting once per 60,000 residents it held", "Virginia and Massachusetts sharing one rotating vote", "Delegates appointed directly by the president", "States buying extra votes with treasury funds"], "example": "One state, one vote regardless of size — while each state kept most power for itself.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-04", "week": "t2l1", "word": "Which important power did Congress LACK under the Articles of Confederation?", "definition": "No tax power existed; Congress could only ask for funds", "wrong": ["The power to declare war on Britain, France, or Spain whenever America felt threatened", "The power to coin money for the whole nation at a federally run mint", "The power to run post offices and post roads spanning all thirteen states", "The power to treat with foreign courts and sign binding treaties abroad", "The power to appoint the officers of the army", "The power to admit Vermont into the union", "The power to survey western townships for sale", "The power to borrow money from France abroad", "The power to request funds from the states"], "example": "Congress could declare war, coin money, run post offices, make treaties, and appoint officers — but not tax, regulate trade, enforce laws, and it had no president or courts.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-05", "week": "t2l1", "word": "The Articles provided no system of courts. What problem did that cause?", "definition": "With no courts, state conflicts like the Vermont claim fight had no arbiter", "wrong": ["Congress losing every shred of power to name officers for the Continental Army in wartime", "States forbidden to print any rival paper currencies of their own during the crisis", "Shays' rebels unable to face a fair trial in any court whatsoever", "The Continental dollar never declared legally worthless by Congress", "Britain immune from all lawsuits over its Great Lakes forts", "Loyalists forever barred from reclaiming any wartime property", "Western settlers unable to buy township sections from Congress", "Indebted farmers unable to fight court seizures of their farms", "Disputed congressional elections never fairly settled at all"], "example": "With no courts, interstate conflicts like the New Hampshire–New York fight over Vermont had no arbiter.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-06", "week": "t2l1", "word": "Who was allowed to vote under most state constitutions after independence?", "definition": "White men over 21 holding property or paying taxes", "wrong": ["Every single adult voting freely, with women and free Black citizens fully included everywhere", "Only sitting members of the Continental Congress allowed to cast votes", "White men over 21 voting with no property bar", "Only holders of western land claims voting", "Women voting everywhere on New Jersey's lead", "Enslaved veterans voting as freemen", "Only taxpayers in governor-led states voting", "Catholics and the propertyless as new voters", "Oath-signers to the Articles all voting"], "example": "Most states: white, male, over 21, plus property or taxes. Exceptions: some New Jersey women for a time, and free African American male property owners in a few states; Pennsylvania had no governor.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-07", "week": "t2l1", "word": "What did the Land Ordinance of 1785 set up for the Northwest Territory?", "definition": "36-section townships at $640, one kept for schools", "wrong": ["A territorial regime guaranteeing settlers' rights while banning slavery there", "Statehood for any western territory once it reached 60,000 free settlers", "Five new states admitted: Ohio, Indiana, Illinois, Michigan, and Wisconsin", "A national bank replacing the Continental dollar", "Federal courts settling the Vermont dispute", "A standing army collecting taxes from states", "Free 40-acre grants to every veteran", "A capital city rising on the Ohio River", "Assemblies for 9,000-resident territories"], "example": "1785: survey into townships, 36 sections of 640 acres at $640 minimum, one section for schools — privatizing federal land. Don't confuse with 1787's government/rights/slavery/statehood terms.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-08", "week": "t2l1", "word": "What did the Northwest Ordinance of 1787 do that the Land Ordinance of 1785 had not?", "definition": "Territorial rule, settlers' rights, no slavery, statehood at 60,000", "wrong": ["Every township split into 36 neat one-mile sections and sold at a $640 minimum price each", "One full school section permanently reserved inside every surveyed township", "Full congressional power to tax all of the western territories", "Federal courts created to settle every state border dispute", "A grant of 640 free acres handed outright to each and every settler", "Vermont admitted into the union at once, ending its long dispute", "Slavery allowed north of the Ohio River to fund the schools", "A brand-new presidency created to execute territorial laws", "Spain forced by Congress to reopen New Orleans shipping"], "example": "1787: government + rights + slavery ban + education + statehood path (60,000). 1785 was the survey-and-sale system ($640 sections, school section).", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-09", "week": "t2l1", "word": "Why did Americans start calling any useless thing 'not worth a Continental'?", "definition": "Paper dollars, unbacked and untaxed, grew nearly worthless", "wrong": ["British agents flooding all thirteen colonies with artfully counterfeited copper and silver coins", "States melting their silver and copper coins down for musket balls", "Spain closing New Orleans and killing all western paper money", "Congress taxing the paper dollars until none remained in hands", "Paper dollars spendable only in faraway foreign countries", "Vermont printing its own dollars that nobody would accept", "Loyalists gleefully burning every Continental bill they found", "Paper bills expiring just one year after the war ended", "France refusing the paper bills as pay for war supplies"], "example": "Continentals weren't backed by gold or silver; states printed rival currencies and refused each other's money, strangling trade.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-10", "week": "t2l1", "word": "What did Shays' Rebellion lead many American leaders to do?", "definition": "It pushed leaders to the May 1787 convention for a new frame", "wrong": ["The newly federal army crushing the farmers, decisively proving Congress's power", "Congress gaining the power to tax immediately in the year 1786", "Every farm debt canceled and all Massachusetts taxes abolished", "Britain politely asked to send royal troops to restore order", "Daniel Shays himself elected governor of Massachusetts", "Every state militia abolished as far too dangerous", "The great Ordinance granting western lands to farmers", "Loyalists fully repaid for all wartime property losses", "All courts shut so that no more farms were seized"], "example": "Shays' 1786 uprising (MA farmers vs taxes and farm seizures, put down by the state militia) convinced leaders the Articles failed — hence Philadelphia, May 1787.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-11", "week": "t2l1", "word": "What freedoms did Virginia's bill of rights guarantee its citizens?", "definition": "Jury trial plus religious and press freedom in Virginia", "wrong": ["Full voting rights for every single adult regardless of any property whatsoever owned", "Total freedom from all taxes and court seizures of farms", "Western lands owned far beyond the Appalachian divide", "Trial by Congress itself, free of all state laws", "Continental currency printed freely by anyone", "Religious freedom guaranteed for Anglicans only", "The president chosen by direct election", "Jury trial carefully kept for owners only", "Free secession from the Confederation"], "example": "Virginia's bill of rights (a list of freedoms government promises to protect) guaranteed jury trial, religious freedom, and press freedom; other states followed.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-12", "week": "t2l1", "word": "Which voters were the exceptions to the white-male-property rule in the early states?", "definition": "Briefly NJ women plus free Black owners in some states", "wrong": ["Women voting freely in every state, permanently and without any restriction at all", "Enslaved men freed through their Revolution service voting", "All white men over 21 voting with property rules aside", "Only Pennsylvanians voting, since they lacked a governor", "Catholics everywhere, a protected class", "Taxed teenagers over sixteen voting", "Settlers of any race or sex voting", "Loyalists swearing to the Articles", "Continental veterans alone voting"], "example": "Rule: white, male, 21+, property/taxes. Exceptions: NJ women briefly; free Black male property owners in a few states.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-13", "week": "t2l1", "word": "Why did delegates struggle to write a national plan even though they agreed on Revolutionary principles?", "definition": "States hoarded power, few national, all feared new tyranny", "wrong": ["France loudly demanding full approval rights over the American plan and its taxes in Congress", "Bitter deadlock over allowing slavery anywhere in the nation", "Congress insisting on a king to lead the new nation", "Delegates begging Parliament to review the plan first", "No workable state constitution fit to serve as a model", "A lasting peace that removed all sense of urgency", "Small states demanding two votes apiece in Congress", "Spain threatening open war unless New Orleans was excluded", "Vermont's stubborn delegates blocking every draft"], "example": "Using state constitutions as guides, delegates still deadlocked over state power vs central power and fear of a new tyranny.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-14", "week": "t2l1", "word": "As a plan of government, what were the Articles of Confederation's strengths?", "definition": "States stayed free while the federal frame stayed weak", "wrong": ["Congress gaining sweeping powers to tax the states and to regulate all trade", "A grand presidency and a full national court system created", "One single currency forced upon every state alike", "Every state government abolished at a single stroke", "The enslaved freed in every state all at once", "Congress wielding its own army, free of the states", "All tangled western claims settled immediately", "Continental dollars solidly backed with gold", "The Articles' framers praised for their wartime compromise"], "example": "Strengths: state freedom + federal limits during a revolution. The tax/trade/courts/president powers listed here are things the Articles specifically lacked.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-15", "week": "t2l1", "word": "Which of these powers DID Congress have under the Articles of Confederation?", "definition": "Naming military officers for the army and militias", "wrong": ["Taxing the states directly and forcefully, without ever asking permission first", "Regulating all trade conducted among the several states", "Executing all the laws through a single president", "Settling every state fight in brand-new national courts", "Forcing rich states to fill the empty treasury", "Barring the states from printing paper money", "Evicting Britain from its Great Lakes forts", "Reopening New Orleans to shipping by force", "Enforcing congressional laws upon the states"], "example": "Congress could declare war, appoint officers, coin money, run post offices, and make treaties — but not tax, regulate trade, enforce laws, and it had no president or courts.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-16", "week": "t2l1", "word": "How did Britain and Spain each exploit the Confederation's weakness after the Revolution?", "definition": "Britain clung to Lakes forts; Spain shut New Orleans shipping", "wrong": ["Britain blockading New Orleans while Spain held the Great Lakes forts", "Spain graciously returning Florida while Britain paid off all U.S. debts", "Britain ratifying Articles; Spain invading Georgia", "Spain throwing New Orleans open while Britain withdrew everywhere", "Britain taxing American ships while Spain coined dollars", "Spain joining the Confederation while Britain seized Vermont", "Britain enforcing U.S. trade laws while Spain guarded them", "Spain lending Congress gold while Britain took Continentals", "Both proud powers honoring every state currency"], "example": "Britain defied the treaty at the Great Lakes; Spain's New Orleans closure strangled western farmers shipping east.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-17", "week": "t2l1", "word": "Under the Northwest Ordinance, what populations let a territory elect an assembly vs apply for statehood?", "definition": "5,000 for an assembly; 60,000 settlers for statehood", "wrong": ["Sixty thousand settlers demanded for an assembly; five thousand for statehood", "Nine states demanded for an assembly; thirteen for statehood", "Thirty-six sections for an assembly; 640 acres for statehood", "Five thousand settlers for a governor; sixty thousand beyond", "Five hundred settlers for an assembly; five thousand after", "Sixty thousand taxpayers; five thousand soldiers after", "Nine delegates for an assembly; only one afterward", "Thirty-six thousand for an assembly; 640,000 after", "Five thousand enslaved for an assembly; 60,000 after"], "example": "5,000 free white males → assembly + non-voting delegate; 60,000 free settlers → constitution + statehood application.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-18", "week": "t2l1", "word": "Which five states were created from the Northwest Territory?", "definition": "Ohio, Indiana, Illinois, Michigan, Wisconsin from the Territory", "wrong": ["Vermont, Kentucky, Tennessee, Maine, and Alabama carved from the Territory", "Virginia, Massachusetts, New York, Connecticut, and Georgia formed from it", "Pennsylvania, New Jersey, Delaware, Maryland, and Carolina created from it", "Florida, Louisiana, Texas, Mississippi, Missouri", "New York, Virginia, Connecticut, Massachusetts, Carolina", "Ohio, Vermont, Kentucky, Maine, Tennessee", "Illinois, Wisconsin, Iowa, Minnesota, Dakota", "Georgia, Alabama, Mississippi, Tennessee, Kentucky", "Florida, Canada, and three river territories"], "example": "The Northwest Territory (west of Pennsylvania, north of the Ohio, south of the Great Lakes, east of the Mississippi) became OH, IN, IL, MI, WI.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-19", "week": "t2l1", "word": "Who was Daniel Shays, and what did his followers actually do in 1786?", "definition": "A farmer-veteran whose followers attacked courthouses", "wrong": ["A wealthy Virginia planter presiding over the 1787 Philadelphia convention", "A British officer seizing farms over unpaid Crown taxes", "A Boston merchant loudly protesting the dollar's collapse", "A Pennsylvania governor personally crushing a tax revolt", "A French volunteer expertly drilling rebel farmers", "A New Jersey judge foreclosing far western lands", "A Connecticut officer collecting the whiskey tax", "A Loyalist raider burning frontier towns with Brant", "A Spanish agent quietly closing New Orleans shipping"], "example": "Shays (farmer, Bunker Hill + Saratoga vet) led 1,000+ farmers against MA taxes and court seizures of farms; the state militia drove them off.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L1-20", "week": "t2l1", "word": "What is an economic depression, and how did the post-Revolution one ruin indebted farmers?", "definition": "Slowing business, dead demand; taxes seized farms", "wrong": ["Banks recklessly printing gold-backed money, making every debt easy to repay", "Booming business, with farmers grown too rich to cope", "Oceans freezing over for years at a time", "Plague killing all stock; a forced factory switch", "Farm taxes so heavy they outlawed farming itself", "Spain cornering the crop and leaving hunger", "British troops burning every southern farm", "All debts forgiven; the lenders destroyed instead", "New states coldly barring indebted settlers"], "example": "Depression = slowing business, falling prices/wages, rising unemployment. Wartime crop demand vanished; loans + MA taxes + court seizures crushed farmers.", "lesson": "Topic 2 · Lesson 1: A Weak Confederation"}, {"id": "L2-01", "week": "t2l2", "word": "When, where, and why did the Constitutional Convention open, and which state refused to send representatives?", "definition": "Philadelphia talks in May of 1787 to revise the Articles; all but Rhode Island came", "wrong": ["New York in September 1787 to write the Bill of Rights, with all thirteen states attending", "Boston in May 1787 to declare independence, with Rhode Island leading the delegates", "Philadelphia in 1776 to sign the Declaration, with Virginia's delegation absent", "New York in 1789 to elect the first President, with only the large states voting", "Philadelphia in May 1787 to crown an American king, with Virginia refusing to come", "Paris in 1783 to negotiate the peace treaty, with Rhode Island the only state present", "Philadelphia in January 1789 to count electoral votes, with small states boycotting", "Yorktown in 1781 to ratify the Articles of Confederation, with New York absent", "Philadelphia in 1791 to add amendments, with Rhode Island hosting the delegates"], "example": "Purpose was revising the Articles; delegates instead wrote a new Constitution. Rhode Island alone stayed home.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-02", "week": "t2l2", "word": "Why did the delegates elect 55-year-old George Washington of Virginia to lead the Constitutional Convention, and what was his role in the debates?", "definition": "Respected Washington, 55, presided; his steady presence mattered the most", "wrong": ["The oldest delegate at 81 taking the presidency and personally writing the entire final draft", "The Virginia Plan's proud author rewarded with the chair and leading every single debate", "The final draft's polisher, famed for speeches, was elected to quiet small states", "The months-long reader of history books mediated disputes as Convention Father", "The Great Compromise deviser was made president by a single-vote margin", "The Serapis captor was honored with the chair though he never attended", "The Paris negotiator was elected to handle all foreign-affairs debates", "The Federalist Papers author was chosen to defend the plan in public", "The slave-counting rule's author was installed as chair by the south"], "example": "Washington's prestige legitimized the Convention; long a caller for stronger central government, he mostly presided rather than debated.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-03", "week": "t2l2", "word": "Why is 36-year-old James Madison of Virginia called the Father of the Constitution?", "definition": "Shy Madison, 36, read history and commerce, shaping the structure", "wrong": ["The silent 55-year-old presider whose mere presence alone legitimized the Convention of 1787", "The polished final-draft author famed for strong-government speeches", "The single-house, one-vote-per-state New Jersey Plan's proposer", "The July 16 Great Compromise worker between large and small states", "The author of more than 50 Federalist Papers defending the plan", "Washington's wartime secretary who kept the Convention's journal", "The three-fifths slave-count balancer of northern and southern votes", "The refuser to sign over too much national power in the plan", "The securer of French soldiers and money as foreign minister"], "example": "Best-prepared delegate; his study and structural ideas shaped the new government.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-04", "week": "t2l2", "word": "What did Alexander Hamilton of New York believe, and how had he served during the Revolution?", "definition": "Ex-secretary Hamilton of NY; the nation sick, needing strong remedies", "wrong": ["The Valley Forge drillmaster who wanted one vote per state kept forever in Congress under the Articles", "The Serapis captor on the North Sea who wanted a king to lead the nation", "The final draft's polisher who wanted three-fifths of slaves counted", "The months-long history reader who wanted small states outvoting large", "The Louisiana governor who wanted Spain joining the Confederation", "The Swamp Fox raider who wanted guerrilla bands in every state", "The Paris negotiator who wanted nine states to ratify treaties", "The Cowpens commander who wanted a staged-retreat militia system", "The first flag's sewer who wanted banners on every statehouse"], "example": "Young Hamilton's remedy for a sick nation under the Articles was strong central power — a view he carried into later Federalist debates.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-05", "week": "t2l2", "word": "What did Gouverneur Morris of Pennsylvania contribute at the Convention?", "definition": "Young Pennsylvanian Morris spoke often and polished the draft", "wrong": ["The Virginian proposing the two-houses-by-population plan together with Madison in May 1787", "The New Jerseyan presenting the one-vote-per-state single-house plan", "The Connecticut man devising the two-senators-per-state compromise", "The months-long commerce reader earning the Father title", "The silent 55-year-old presider legitimizing the proceedings", "The Mason-Gerry ally refusing to sign over national power", "The three-fifths counter of enslaved residents for seats", "The twelve-amendment author of the first Congress", "The Yorktown marcher trapping Cornwallis with Washington"], "example": "Morris's speeches pushed strong government and his pen gave the finished Constitution its final polish.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-06", "week": "t2l2", "word": "What did James Wilson of Pennsylvania contribute at the Convention?", "definition": "Wilson's political knowledge clarified the hard issues", "wrong": ["The celebrated speechmaker for strong government who polished the finished draft", "The single-house, one-vote-per-state legislative plan's proposer", "The two-house large-small compromise worker in July", "The unanimous choice presiding over every session", "The history-and-commerce reader called the Father", "The Randolph-Mason ally refusing to sign the plan", "The Objections pamphleteer demanding a bill of rights", "The pen-name essayist writing most Federalist Papers", "The twenty-year slave-trade protection's securer"], "example": "Wilson's admired political knowledge made him the Convention's clarifier of hard issues.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-07", "week": "t2l2", "word": "What happened when the Constitution was ready to sign on September 17, 1787?", "definition": "Franklin bade doubters sign; three dissenters refused", "wrong": ["All 55 delegates signing the parchment at once while Washington polished the final draft in September 1787", "Washington refusing to sign until a bill of rights was added", "Franklin, Madison, and Wilson refusing to sign over slavery", "Small states walking out, leaving large-state signers only", "Rhode Island's delegates signing last after land holdouts", "Delegates keeping the Articles, so nobody signed the plan", "Signing waiting twenty years for the slave-trade ban", "Only nine delegates signing, the minimum for effect", "Franklin signing alone while 54 demanded private talks"], "example": "Franklin's plea carried the day; the three refusers feared national power — foreshadowing the ratification fight.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-08", "week": "t2l2", "word": "Why did the delegates decide to keep their Convention talks private?", "definition": "Delegates wanted free speech without any outside pressures", "wrong": ["They feared British spies blockading Philadelphia as in the war", "They were ashamed of replacing the Articles, hiding it from Washington", "They charged admission to fund the new government with ticket sales", "They believed Rhode Island would invade on learning of the meeting", "They hid the slave-trade debate from southern papers for years", "They wrote in code only Madison's books could decipher", "They feared the French fleet sailing up the Delaware on leaks", "They planned surprising King George with a finished monarchy", "The Articles barring meetings larger than nine"], "example": "Privacy enabled frank exploration; most already agreed the Articles made central government too weak — but not monarchy-strong.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-09", "week": "t2l2", "word": "What did the Virginia Plan, proposed by Randolph and Madison, call for?", "definition": "Randolph and Madison: strong rule, three branches, two houses", "wrong": ["A weak league of states with one house keeping one vote per state forever under the Articles", "A monarchy of three estates with large-state inherited seats", "A single popularly elected executive with no legislature", "Three branches with a one-house, two-senators-each legislature", "A confederation where Congress taxed but states kept courts", "Two houses where small states outvoted the large ones", "A government with no executive, run by legislatures", "A legislature picking judges, executives running the army", "Counting three-fifths of slaves, giving Congress no powers"], "example": "Virginia's population-based two-house design favored large states — which is why small states fought it.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-10", "week": "t2l2", "word": "What did the New Jersey Plan, presented by William Paterson after two weeks of debate, call for?", "definition": "Paterson: three branches, one house with one vote per state", "wrong": ["Two population houses led by a popularly picked chief executive officer of the new nation", "One population house plus a king chosen by the large states", "Three branches with a legislator-picked two-per-state Senate", "No branches at all, every power left with governors", "A two-house Congress with treasury-bought seats", "Three branches with executives picking the judges", "One house with tax-proportioned votes", "Nine states legislating with four merely observing", "Courts appointing fresh legislatures yearly"], "example": "Paterson's small-state plan kept the Articles' equal-state vote inside a three-branch frame.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-11", "week": "t2l2", "word": "What was the essential difference between the Virginia Plan and the New Jersey Plan?", "definition": "Virginia: houses by population; New Jersey: one vote per state", "wrong": ["Virginia demanding a king for America while New Jersey wanted three presidents at once instead", "Virginia wanting no courts while New Jersey gave judges to Congress", "Virginia keeping the Articles while New Jersey scrapped them entirely", "Virginia favoring big-land states, New Jersey favoring industry", "Virginia banning slavery at once while New Jersey kept it", "Virginia seeking French approval while New Jersey sought Spain's", "Virginia wanting one house, New Jersey two by population", "Virginia demanding unanimity, New Jersey a majority of nine", "Virginia taxing sans representation; New Jersey reversing it"], "example": "Population vs equality: the Convention's core split was large-population vs small-population states.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-12", "week": "t2l2", "word": "In what ways were the Virginia Plan and the New Jersey Plan alike?", "definition": "Both sought three branches with an elected legislature", "wrong": ["Both keeping one house with one vote per state exactly as in the Articles", "Both giving both houses to population with all judges elected", "Both creating a king with Parliament approving American laws", "Both freeing all enslaved people and banning the trade at once", "Both had legislatures picking the President every seven years", "Both left Congress unable to regulate trade or coin money", "Both required unanimous state approval before any law", "Both counted the enslaved at three-fifths for taxes", "Both left all military power with state militias"], "example": "Shared ground — three branches and elected lawmakers — let the Convention compromise on the rest.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-13", "week": "t2l2", "word": "How did the Virginia Plan and the New Jersey Plan differ on the executive branch?", "definition": "Virginia: legislature picks one chief; New Jersey picks executives", "wrong": ["Virginia electing its chief by popular vote while New Jersey courts appointed one under rival plans", "Virginia with no executive while New Jersey crowned a king for life", "Virginia rotating governors; New Jersey handing the job to Franklin", "Virginia giving it to the largest state; New Jersey to the smallest", "Virginia letting France appoint; New Jersey letting Spain appoint", "Virginia making Washington life executive; New Jersey electing biennially", "Virginia merging executive and courts; New Jersey merging legislature", "Virginia selling the office for funds; New Jersey awarding by lottery", "Both plans agreeing on a legislature-picked single chief"], "example": "Even the plans' charts differed here: legislature-picked single chief vs plural executives picking judges.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-14", "week": "t2l2", "word": "What was the Great Compromise that Roger Sherman of Connecticut worked out with Oliver Ellsworth, approved July 16?", "definition": "Sherman's plan: population House plus two senators per state", "wrong": ["A single house with one vote per state, approved quickly without any debate in July", "Two population houses with senators directly elected all at once", "A Congress-picked executive and state-picked courts, in September", "Full counting of the enslaved, after the trade ban", "Large states outvoting small ones in both houses", "Slavery banned north of the Ohio, guarded south", "The Articles kept unchanged as tempers flared", "Taxation for Congress but no courts, by order", "The capital moved southward for votes in 1790"], "example": "Each side gave up demands in civic virtue: large states won a population House, small states an equal Senate.", "lesson": "Topic 2 · Lesson 2: Drafting a Constitution"}, {"id": "L2-15", "week": "t2l2", "word": "What was the Three-Fifths Compromise, and where did its fraction come from?", "definition": "Three-fifths counted for seats — 5,000 as 3,000 — from old taxes", "wrong": ["Three-fifths of the states approving each law, taken from the nine-state rule of 1787", "Each enslaved person counting as three full voters, taken from Virginia", "Three of five southern states vetoing taxes, borrowed from Parliament", "The enslaved counted fully for taxes but never for seats", "Three
