n strict proportion to each state's census population", "Collect duties solely from imports, never from any citizen's wages or rents", "Require each state legislature to approve every federal tax rate each year"], "example": "'From whatever source derived' — wages, rents, and profits all taxable directly.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-17", "week": "t2l7", "word": "Which ruling did the Sixteenth Amendment overturn?", "definition": "Pollock v. Farmers' Loan (1895), voiding the income tax as unapportioned", "wrong": ["Dred Scott", "Plessy v. Ferguson", "Lochner v. New York", "Marbury v. Madison", "Gibbons v. Ogden", "The Slaughterhouse Cases", "Springer v. United States, which had upheld the Civil War income tax in 1881", "A unanimous Court ordering Congress to refund every dollar ever collected", "Minor v. Happersett, denying women the vote under the Fourteenth Amendment"], "example": "Pollock called income tax 'direct,' needing apportionment; 1913 erased that bar.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-18", "week": "t2l7", "word": "Why did Progressives want the income tax amendment?", "definition": "Tariffs fell hardest on consumers; incomes could fund government fairly", "wrong": ["To ban alcohol", "To fund World War I", "To elect senators", "To end the trusts", "To build railroads", "To arm the navy", "Gold discoveries in Alaska had flooded the Treasury with surplus revenue", "Factory owners demanded it to stabilize prices after the Panic of 1907", "Western silver miners sought cheaper dollars through a rewritten tax code"], "example": "Shift the load from regressive tariffs at the store to ability to pay.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-19", "week": "t2l7", "word": "What did the Seventeenth Amendment (1913) change?", "definition": "Senators elected directly by voters instead of state legislatures", "wrong": ["House terms to six years", "Presidents picked by Congress", "Judges elected yearly", "Voting age to eighteen", "Ended the Senate", "One senator per state", "Governors gained power to veto any senator's vote on treaties and tariffs", "Each legislature kept choosing one senator while voters chose the other", "Senators began serving at the pleasure of governors, removable any session"], "example": "Deadlocked legislatures and bought seats gave way to popular vote.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-20", "week": "t2l7", "word": "What abuses pushed the states to demand direct election of senators?", "definition": "Legislative deadlocks leaving seats vacant, plus bribed millionaire choices", "wrong": ["Too many elections", "Slow mail delivery", "Long Senate terms", "Dirty campaigns", "Low voter turnout", "Boring debates", "Senators openly auctioning their tariff votes to the highest corporate bidder in smoke-filled rooms", "Statehouses choosing senators by drawing lots from a hat each session every single year", "Western states refusing to send senators until silver was coined freely"], "example": "The 'millionaires' club,' chosen in smoke-filled rooms — sometimes after years of deadlock.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-21", "week": "t2l7", "word": "How are Senate vacancies filled under the Seventeenth Amendment?", "definition": "Governors call elections; legislatures may let them appoint temporarily", "wrong": ["The President appoints", "The House elects", "Seats stay vacant", "Senators pick heirs", "Voters draw lots", "The old senator returns", "The Vice President breaks ties to install a personally chosen successor", "State supreme courts nominate three candidates for the governor to rank in order", "The Senate itself votes a replacement from the former senator's party ranks by majority vote"], "example": "Election is the rule; temporary appointment only if state law allows.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-22", "week": "t2l7", "word": "What did the Eighteenth Amendment (1919) prohibit?", "definition": "Making, selling, or hauling intoxicating liquors for beverage use", "wrong": ["Drinking alcohol", "Smoking tobacco", "Gambling dens", "Brewing coffee", "Voting while drunk", "Owning a saloon sign", "Doctors prescribing whiskey and churches using sacramental wine ever again", "Every use of alcohol including medicines, fuel, and industrial solvents", "States passing any liquor law stricter than the federal Volstead Act itself"], "example": "Banned the traffic — make, sell, carry — not the sip; medicine and rites excepted.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-23", "week": "t2l7", "word": "What enforced the Eighteenth Amendment, and with what result?", "definition": "The Volstead Act; speakeasies, bootleggers, and organized crime boomed", "wrong": ["No law at all", "State bans only", "The Espionage Act", "Martial law", "Dry navy patrols", "Church sermons", "The Harrison Narcotics Act jailing bartenders while saloons quietly complied", "Federal agents closed every brewery within months and drinking vanished by 1921", "The Supreme Court voided the amendment before a single saloon ever closed"], "example": "Law without consent: the noble experiment funded the mob instead.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-24", "week": "t2l7", "word": "What makes the Eighteenth Amendment unique among amendments?", "definition": "The only one ever repealed — undone by the Twenty-First in 1933", "wrong": ["Never ratified", "Still in force", "Passed in 1776", "Has no text", "Banned by courts", "Repealed twice over", "The first amendment ever proposed by a national referendum of all voters", "Ratified by state conventions rather than by state legislatures in 1919", "The only one the Supreme Court struck down as unconstitutional in 1920"], "example": "Fourteen dry years, then repeal — the Constitution's only U-turn.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-25", "week": "t2l7", "word": "How long was the road to the Nineteenth Amendment?", "definition": "Seventy-two years from Seneca Falls (1848) to ratification (1920)", "wrong": ["One quick year", "A single summer", "Ten short years", "Since 1776", "Four Civil War years", "Nine decades flat", "Susan Anthony voting in 1872 and winning a full acquittal from the jury", "Congress passing it unanimously within weeks of America's entry into World War I", "President Wilson opposing it until the 1920 election finally forced his hand"], "example": "Seneca Falls demanded the ballot in 1848; Tennessee sealed it in August 1920.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-26", "week": "t2l7", "word": "What did the Nineteenth Amendment leave states free to do?", "definition": "Set neutral voter rules like age and residency for everyone alike", "wrong": ["Bar women still", "End all voting", "Pick the President", "Tax ballots by sex", "Limit men only", "Jail suffragists", "Deny ballots to women who owned no property or paid no poll tax at all", "Require literacy tests of women while exempting every man from the same exam", "Refuse to count ballots cast by married women voting against their husbands"], "example": "Sex off the ballot box — but neutral rules (age, residency) still applied to all.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-27", "week": "t2l7", "word": "Which state put the Nineteenth Amendment over the top?", "definition": "Tennessee, the 36th state, by one vote in August 1920", "wrong": ["Wyoming first", "New York alone", "California last", "No state ever did", "All fifty at once", "Ohio in 1919", "North Carolina, whose governor signed ratification amid yellow roses", "Vermont's governor calling a special session to break the deadlock", "Connecticut racing Tennessee to deliver the final vote that same summer"], "example": "Thirty-six needed; Harry Burn's switched vote made Tennessee the perfect 36.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-28", "week": "t2l7", "word": "What did the Twentieth Amendment (1933) shorten?", "definition": "Lame-duck waits: Congress starts Jan 3, Presidents sworn Jan 20", "wrong": ["Senate terms", "Election campaigns", "Court sessions", "The school year", "War enlistments", "The census count", "Presidential terms from four years down to a single two-year stretch", "The House calendar so members serve only while Congress sits in session", "Congressional pay for any member defeated while seeking reelection in November"], "example": "Defeated officials lingered till March; now the new team starts in January.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-29", "week": "t2l7", "word": "Why did the old March 4 inauguration become a problem?", "definition": "Four dead months let rejected leaders govern through crises like 1932-33", "wrong": ["March weather", "Slow horses", "No telegraphs", "Cold inaugurations", "Short ballots", "Lost luggage", "Hoover and Roosevelt agreed on every emergency measure that whole winter", "The 1861 secession winter proved lame ducks always handle crises perfectly", "November elections were impossible to certify before the following summer"], "example": "Buchanan dithered in 1861, Hoover froze in 1933 — lame ducks fail lame tests.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-30", "week": "t2l7", "word": "What did the Twentieth Amendment say if a President-elect dies?", "definition": "The Vice President-elect becomes President on Inauguration Day", "wrong": ["New election held", "The loser serves", "Congress picks anyone", "The old President stays", "No one serves", "The Chief Justice rules", "The Speaker of the House serves the full four-year term instead", "Electors reconvene in December to choose an entirely new ticket", "The Supreme Court appoints an acting President until the next census"], "example": "Death before Day One: the deputy steps up — Greeley's 1872 case closed.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-31", "week": "t2l7", "word": "What did the Twenty-First Amendment (1933) do?", "definition": "Repealed Prohibition; states again control liquor within their borders", "wrong": ["Banned liquor again", "Lowered voting age", "Ended poll taxes", "Limited presidents", "Taxed incomes", "Armed the navy", "Kept breweries illegal while letting wineries and distilleries reopen freely at once", "Gave Congress sole power to set a national drinking age of twenty-one in every state", "Ordered every state to permit saloons, bars, and liquor stores by 1935"], "example": "The only repeal: saloons returned, but dry states and counties stayed legal.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-32", "week": "t2l7", "word": "How was the Twenty-First Amendment ratified?", "definition": "State conventions, the only amendment ratified that way", "wrong": ["By Congress alone", "By the President", "By the courts", "Never ratified", "By referendum", "By governors only", "State legislatures, the same method used for every other amendment", "A national popular vote held alongside the 1932 presidential election", "Congress declaring it self-executing without any state action at all"], "example": "Congress feared dry legislatures, so it sent repeal to conventions of the people.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-33", "week": "t2l7", "word": "What did Section 2 of the Twenty-First Amendment protect?", "definition": "Dry states: banning liquor shipments into states that forbid it", "wrong": ["Wet states only", "Federal saloons", "Free imports", "Cheap whiskey", "Open borders", "Home brewing bars", "Bootleggers pardoned for every crime committed during the dry years", "A national chain of government liquor stores from Maine to California", "Breweries shipping freely into dry states despite their local laws"], "example": "Repeal was not a mandate: Mississippi stayed dry statewide into the 1960s.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-34", "week": "t2l7", "word": "What limit did the Twenty-Second Amendment (1951) set?", "definition": "No one elected President more than twice (ten years max with succession)", "wrong": ["One term only", "No age limits", "Judges retired", "Three full terms", "Senators limited", "Governors capped too", "Vice Presidents who succeed a fallen President may never run on their own", "Former Presidents forbidden to hold any federal office, seat, or judgeship again", "Every federal officeholder from clerks to Chief Justice capped at eight years"], "example": "FDR's four elections (1932-44) broke the custom; 1951 wrote the rule.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-35", "week": "t2l7", "word": "Whose presidency caused the Twenty-Second Amendment?", "definition": "Franklin Roosevelt's four wartime election victories, 1932 to 1944", "wrong": ["Washington's two", "Lincoln's two", "Grant's attempt", "T. Roosevelt's try", "Hoover's one", "Cleveland's split pair", "Ulysses Grant winning a third straight term before retiring to write memoirs", "Theodore Roosevelt serving nearly ten years across two full elected terms", "Woodrow Wilson's stroke in 1919 leaving no one clearly in charge for months"], "example": "Grant and TR tried for thirds and failed; FDR won four — and Congress acted.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-36", "week": "t2l7", "word": "What did the Twenty-Second Amendment say about a sitting President?", "definition": "It exempted Truman, the President serving when it was proposed", "wrong": ["Removed Truman", "Jailed violators", "Ended all terms", "Banned Democrats", "Skipped elections", "Crowned Eisenhower", "Harry Truman ran for and won a third full term in 1952 regardless", "Every living ex-President regained eligibility for two fresh terms at once", "Truman was forced to resign the moment Nevada completed ratification"], "example": "Written for the future: Truman could have run again, but chose not to.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-37", "week": "t2l7", "word": "What did the Twenty-Third Amendment (1961) give Washington, D.C.?", "definition": "Presidential electors, as if D.C. were a state — currently three", "wrong": ["Two senators", "Statehood itself", "A governor", "Full House seats", "Its own army", "A state flag", "Voting members of Congress with power over war, taxes, and treaties", "Presidential ballots for federal workers stationed anywhere in the world", "The same electoral weight as California, Texas, and Florida combined"], "example": "Taxation with some representation: D.C. votes for President since 1964.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-38", "week": "t2l7", "word": "What cap did the Twenty-Third Amendment put on D.C.'s electors?", "definition": "No more electors than the least populous state holds", "wrong": ["Zero electors", "One elector", "Ten electors", "Fifty electors", "No cap at all", "Three hundred", "The same number as Virginia, its larger neighbor across the Potomac", "Electors equal to Maryland's delegation, fixed when the District was carved out", "Whatever number Congress grants by ordinary statute each election cycle"], "example": "A state-sized floor with a small-state ceiling — three votes in practice.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-39", "week": "t2l7", "word": "Why did D.C. residents need the Twenty-Third Amendment to vote for President?", "definition": "Only states appoint electors, and D.C. is a federal district, not a state", "wrong": ["They were enslaved", "They paid no taxes", "They were too young", "No one lived there", "They refused to vote", "They voted in secret", "Maryland and Virginia reclaim their ceded land every presidential election year", "The Constitution banned cities larger than ten thousand from voting at all", "Federal workers everywhere were barred from presidential ballots until 1961"], "example": "The Framers' federal enclave had no state — and only states choose electors.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-40", "week": "t2l7", "word": "What did the Twenty-Fourth Amendment (1964) ban?", "definition": "Poll taxes in federal elections — no fee to vote for President or Congress", "wrong": ["Income taxes", "Property taxes", "All literacy tests", "Voter registration", "Secret ballots", "Party primaries", "Every poll tax in every election, state and local contests included without any exception", "The white-only primaries Texas Democrats ran until Smith v. Allwright in 1944", "Requiring voters to own land, pay debts, or pass exams before voting"], "example": "A dollar or two at the courthouse door had barred poor Black — and white — voters.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-41", "week": "t2l7", "word": "Which elections did the Twenty-Fourth Amendment leave untouched?", "definition": "State and local races — the Court reached those in Harper (1966)", "wrong": ["None at all", "Presidential ones", "Senate races", "House races", "Primary contests", "Every single race", "Mississippi's literacy tests survived completely untouched until the 1980s", "Alabama charged voters a fee for presidential ballots until the 1970s", "Five Southern states kept every poll tax fully legal for another decade"], "example": "Federal door opened in '64; Harper opened the statehouse door two years later.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-42", "week": "t2l7", "word": "How did poll taxes actually block Black voters?", "definition": "Fees stacked year after year, due months early, in cash, in person", "wrong": ["They taxed land", "They banned parties", "They closed polls", "They required guns", "They exiled voters", "They seized homes", "The tax receipts doubled as literacy certificates valid for ten full years", "White voters paid a penny while Black voters paid fifty dollars each time", "Anyone too poor to pay was automatically drafted into the state militia ranks"], "example": "Cumulative, early, cash-only — poverty plus red tape equaled disenfranchisement.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-43", "week": "t2l7", "word": "What did the Twenty-Fifth Amendment (1967) settle about Vice Presidents?", "definition": "Presidents nominate replacements; both Houses of Congress confirm", "wrong": ["Veep office ends", "Senate picks alone", "Voters elect one", "Speaker steps up", "Office stays empty", "Eldest governor serves", "Spiro Agnew resigned in 1973 and the office sat vacant for years after", "Congress elects a Vice President by joint ballot whenever one resigns", "The defeated presidential runner-up automatically becomes Vice President"], "example": "Used twice in two years: Ford replaced Agnew (1973), Rockefeller replaced Ford (1974).", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-44", "week": "t2l7", "word": "How can a disabled President be sidelined under the Twenty-Fifth Amendment?", "definition": "The VP plus a Cabinet majority declare him unable; Congress decides disputes", "wrong": ["Congress votes alone", "The Court removes him", "The army steps in", "Governors petition", "No process exists", "The press decides", "Section 4 lets the Cabinet remove any President it merely disagrees with", "The First Lady and family physician sign a certificate of incapacity behind closed doors", "The Chief Justice examines the President and rules him fit or unfit to serve on live television"], "example": "Never used: written for strokes and comas, debated ever since.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-45", "week": "t2l7", "word": "What tragedy made the Twenty-Fifth Amendment urgent?", "definition": "Kennedy's 1963 assassination left succession and disability unclear", "wrong": ["Lincoln's death", "FDR's four terms", "Nixon's resignation", "The Civil War", "Watergate break-in", "The Bay of Pigs", "Garfield lingering eighty days in 1881 with no one clearly empowered to act", "Wilson's stroke hiding the presidency behind closed doors for a full year", "Eisenhower's heart attack forcing a secret transfer nobody recorded in 1955"], "example": "A murdered President, a vacant VP slot, an aging successor — 1963 demanded answers.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-46", "week": "t2l7", "word": "What did the Twenty-Sixth Amendment (1971) establish?", "definition": "Citizens eighteen and older cannot be denied the vote for age", "wrong": ["Voting at sixteen", "Voting at twenty-one", "No voting under thirty", "Women's suffrage", "D.C. electors", "All teens must vote", "States may still set higher ages for their own state and local contests", "Congress gained power to draft eighteen-year-olds but not to enfranchise them", "The voting age drops to sixteen in presidential years, twenty-one otherwise"], "example": "'Old enough to fight, old enough to vote' — Vietnam's draft-age slogan made law.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-47", "week": "t2l7", "word": "Why did the voting age drop in 1971?", "definition": "Vietnam draftees died at eighteen but could not vote until twenty-one", "wrong": ["Cold War fears", "Campus riots", "Teacher strikes", "Low turnout", "A court order", "Soviet pressure", "Recruiters found eighteen-year-olds refusing induction without a ballot in hand", "Nixon promised it to win back the student votes he had lost in 1968", "Colleges required voter registration before freshmen could enroll for classes"], "example": "Dying in rice paddies, voiceless at home — the contradiction broke the old rule.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-48", "week": "t2l7", "word": "What mess did Oregon v. Mitchell (1970) create?", "definition": "Congress could lower the age for federal races, but not state ones", "wrong": ["Ended all voting", "Banned the draft", "Voided the census", "Freed all draftees", "Closed colleges", "Jailed protesters", "Eighteen-year-olds voted for President while barred from every House race", "Congress responded by raising the draft age to twenty-one within weeks", "The ruling applied only to Oregon, leaving forty-nine systems untouched"], "example": "Split rolls for split elections — chaos Congress fixed with an amendment in months.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-49", "week": "t2l7", "word": "What does the Twenty-Seventh Amendment (1992) delay?", "definition": "Congressional pay changes until after the next House election", "wrong": ["Tax collections", "Court rulings", "Treaty signings", "Census counts", "Inaugurations", "Veto overrides", "Presidential salary increases until the incumbent leaves office for good", "Judicial salaries from rising during any judge's lifetime tenure on the bench", "The federal minimum wage, frozen whenever Congress grants itself a raise"], "example": "No election in between, no raise in pocket — voters get a verdict first.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-50", "week": "t2l7", "word": "Why did the Twenty-Seventh Amendment take 202 years to ratify?", "definition": "Proposed in 1789, forgotten, revived by a student's 1982 campaign", "wrong": ["Courts blocked it", "Wars delayed it", "Ink shortages", "Voters rejected it", "States seceded", "It was vetoed", "James Madison withdrew it in 1791 after only six states had ratified", "Southern states filibustered it from 1830 until the civil rights era", "Every state ratified it twice, doubling the required three-fourths count"], "example": "Madison's leftover plus a C-grade paper equals the slowest amendment ever.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L7-51", "week": "t2l7", "word": "What 1989 event revived the pay amendment?", "definition": "Congress's attempted fifty-percent raise sparked public fury", "wrong": ["A market crash", "A lost war", "A census error", "A spy scandal", "A veto fight", "A bank failure", "The House voting to double salaries while cutting veterans' benefits in half", "The Speaker resigning after reporters found tripled paychecks in the ledger", "Federal judges suing Congress for raises and winning decades of back pay"], "example": "Outrage over the 1989 raise push gave Watson's crusade its final votes.", "lesson": "Extra Topic: Amendments 11-27"}, {"id": "L8-01", "week": "t2l8", "word": "What two religion rules does the First Amendment set?", "definition": "No established church; no laws blocking the free exercise of faith", "wrong": ["One national church", "All worship banned", "Taxes on sermons", "Popes pick bishops", "Only Quakers pray", "Atheists must convert", "Congress funds every denomination equally but bars new sects from forming", "Every town must hold a single Sunday service approved by the mayor", "The President leads national prayer and appoints chaplains to each regiment"], "example": "Disestablishment plus free exercise: no state church, no banned chapel.", "lesson": "Extra Topic: The Bill of Rights in Depth"}, {"id": "L8-02", "week": "t2l8", "word": "What speech falls outside First Amendment protection?", "definition": "Incitement, true threats, and fraud — the 'fire in a theater' line", "wrong": ["Mean editorials", "Angry sermons", "Rude protests", "Dirty jokes", "Harsh novels", "Biased news", "Criticizing the President during wartime has never been protected at all", "Newspapers need licenses and must print official replies to every story", "Peaceful boycotts and sit-ins count as conduct, never as protected speech"], "example": "Falsely shouting fire was Holmes's 1919 example of punishable speech.", "lesson": "Extra Topic: The Bill of Rights in Depth"}, {"id": "L8-03", "week": "t2l8", "word": "What 1798 law tested the First Amendment within a decade?", "definition": "The Sedition Act jailing critics; it expired unlamented in 1801", "wrong": ["The Stamp Act", "The Tea Act", "The Volstead Act", "The Patriot Act", "The Slave Code", "The Iron Act", "Federalist judges hanged three editors before Jefferson pardoned the rest", "Adams signed it to gag French agents after the XYZ Affair broke open", "Matthew Lyon's function $(id) { return document.getElementById(id); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* Build 4 options: the correct answer + 3 distractors sampled fresh
   from this question's own wrong list on every run. */
function buildOptions(entry, all) {
  const usedDefs = new Set([entry.definition]);
  const pool = shuffle((entry.wrong || []).filter(function (w) { return w && !usedDefs.has(w); }));
  const opts = [{ text: entry.definition, kind: "correct" }];
  for (let k = 0; k < 3 && pool.length; k++) {
    const t = pool.pop();
    opts.push({ text: t, kind: "wrong" });
    usedDefs.add(t);
  }
  return shuffle(opts);
}

function startGame(filter) {
  state.filter = (filter === undefined) ? state.filter : filter;
  const pool = state.filter === "all" ? WORDS.slice() : WORDS.filter(w => String(w.week) === String(state.filter));
  const n = state.count === "all" ? pool.length : Math.min(parseInt(state.count, 10) || pool.length, pool.length);
  state.queue = shuffle(pool.slice()).slice(0, n);
  state.idx = 0; state.score = 0; state.streak = 0;
  state.right = 0; state.wrong = 0; state.trapHits = 0; state.missed = []; state.loseStreak = 0;
  nextQuestion();
}

function nextQuestion() {
  state.locked = false;
  hideOverlay();
  if (state.idx >= state.queue.length) { endScreen(); return; }
  const entry = state.queue[state.idx];
  state.current = { entry: entry, options: buildOptions(entry, WORDS) };
  render();
}

function render() {
  const c = state.current, entry = c.entry;
  $("weekPill").textContent = entry.lesson || ("Lesson " + entry.week);
  $("typePill").textContent = "question";
  $("word").textContent = entry.word;
  $("prompt").textContent = "Choose the correct answer:";
  $("hint").textContent = "4 answers: the correct one plus 3 look-alikes drawn from similar events. Read carefully.";
  buddyMood();
  updateFury();
  runBlab();
  $("qnum").textContent = (state.idx + 1) + "/" + state.queue.length;
  $("score").textContent = state.score;
  $("streak").textContent = state.streak;
  $("bar").style.width = Math.round((state.idx / state.queue.length) * 100) + "%";
  const box = $("options");
  box.innerHTML = "";
  c.options.forEach(function (o, i) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.dataset.idx = i;
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + escapeHtml(o.text) + '</span>';
    b.addEventListener("click", function () { answer(i); });
    box.appendChild(b);
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

let soundOn = true;

function tone(freq, delay, dur, type, vol, slideTo) {
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  } catch (e) { /* audio unavailable: stay silent */ }
}

  if (actx) { try { actx.close(); } catch (e) {} }

    (state.missed.length
      ? '<div class="miss-list"><span>Study these ' + state.missed.length + ':</span>' +
        state.missed.map(function (w) { return '<div><b>Q:</b> ' + escapeHtml(w.word) + '<br><b>A:</b> ' + escapeHtml(w.definition) + '</div>'; }).join('') + '</div>' +
        '<button id="retryBtn" type="button">Retry missed (' + state.missed.length + ')</button>'
      : '<p class="detail">Flawless — nothing to review!</p>') +
    '<button id="nextBtn" type="button">Play again</button>';
  if (cls === "happy") addSparkles(panel, banner ? 60 : 30); else addTears(panel, true);
  if ($("retryBtn")) $("retryBtn").addEventListener("click", retryMissed);
  $("nextBtn").addEventListener("click", function () { startGame(state.filter); });
  kickAnimation(ov);
  $("bar").style.width = "100%";
}

document.addEventListener("DOMContentLoaded", function () {
  $("weekFilter").addEventListener("change", function (e) { startGame(e.target.value); });
  /* study buddy watches the cursor and hops on click */
  (function () {
    const buddy = document.getElementById("buddy");
    if (!buddy || typeof buddy.getBoundingClientRect !== "function") return;
    const pupils = document.getElementById("buddyPupils");
    const bhead = document.getElementById("buddyHead");
    const calmMotion = (typeof window !== "undefined") && !!window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (calmMotion) return;
    let mx = (typeof innerWidth !== "undefined") ? innerWidth / 2 : 0;
    let my = 0, ticking = false;
    function buddyLook() {
      ticking = false;
      const r = buddy.getBoundingClientRect();
      const dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height / 2);
      const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      const px = (dx / d) * Math.min(4, d / 40), py = (dy / d) * Math.min(4, d / 40);
      if (pupils) pupils.setAttribute("transform", "translate(" + px.toFixed(1) + "," + py.toFixed(1) + ")");
      if (bhead) bhead.setAttribute("transform", "rotate(" + (Math.max(-6, Math.min(6, dx / 60))).toFixed(1) + " 60 55)");
    }
    document.addEventListener("mousemove", function (e) {
      mx = e.clientX; my = e.clientY;
      if (!ticking) { ticking = true; requestAnimationFrame(buddyLook); }
    });
    document.addEventListener("click", function () {
      buddy.classList.remove("hop");
      void buddy.offsetWidth;
      buddy.classList.add("hop");
    });
  })();
  $("countSelect").addEventListener("change", function (e) { state.count = e.target.value; startGame(state.filter); });
  $("restartBtn").addEventListener("click", function () { startGame(state.filter); });
  $("soundBtn").addEventListener("click", function (e) {
    soundOn = !soundOn;
    e.target.textContent = soundOn ? "Sound: on" : "Sound: off";
    if (!soundOn) killAudio();
  });
  $("musicBtn").addEventListener("click", function (e) {
    musicOn = !musicOn;
    e.target.textContent = musicOn ? "Music: on" : "Music: off";
    if (musicOn) startMusic(); else killAudio();
  });
  document.addEventListener("pointerdown", function bootMusic() {
    document.removeEventListener("pointerdown", bootMusic);
    startMusic();
  });
  startGame("all");
});

globalThis.__historyTrivia = { state: state, buildOptions: buildOptions, answer: answer, nextQuestion: nextQuestion, startGame: startGame };
</script>
